<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration"/>

  <g id="page-head" data-pptx-bounds="64 44 1152 140">
    <rect x="64" y="52" width="150" height="28" rx="14" fill="#24507F"/>
    <text x="80" y="72" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="15" fill="#FFFFFF">手順 3 ・ 画面 5</text>
    <text x="64" y="128" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="40" font-weight="700" fill="#1F2A37">AIに改修してもらいます</text>
    <text x="64" y="164" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#5D6B7A">添付するコードは置き換え済みで、依頼文には「元の値へ戻さない」と書かれています。</text>
    <rect x="64" y="180" width="1152" height="1" fill="#CFD7DE"/>
  </g>

  <g id="shot-repair-request" data-pptx-bounds="64 200 560 372">
    <rect x="64" y="200" width="560" height="336" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image x="80" y="216" width="528" height="297" href="images/15-repair-request.png" preserveAspectRatio="xMidYMid meet"/>
    <text x="64" y="562" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" fill="#5D6B7A">診断のときと同じ形です。渡して、返答を戻します。</text>
  </g>

  <g id="shot-repair-imported" data-pptx-bounds="656 200 560 372">
    <rect x="656" y="200" width="560" height="336" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image x="672" y="216" width="528" height="297" href="images/16-repair-imported.png" preserveAspectRatio="xMidYMid meet"/>
    <text x="656" y="562" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" fill="#5D6B7A">取り込めたところ。「2個のモジュールを取り込み済み」。</text>
  </g>

  <g id="files-note" data-pptx-bounds="64 578 560 70">
    <rect x="64" y="578" width="560" height="66" rx="10" fill="#F2F6FB"/>
    <text x="88" y="606" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="15" fill="#1F2A37">添付する source-code-for-ai.md は置き換え済み。<tspan x="88" dy="24">source-code.md は読み取った時点のままで動きません。</tspan></text>
  </g>

  <g id="nochange-note" data-pptx-bounds="656 578 560 70">
    <rect x="656" y="578" width="560" height="66" rx="10" fill="#FFFFFF" stroke="#CFD7DE" stroke-width="1"/>
    <text x="680" y="606" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="15" fill="#1F2A37">AI が直せないと判断したときは理由が返り、ビルドへ進みません。<tspan x="680" dy="24">（改修は不要／この方法では改修できません／依頼の内容を決められません）</tspan></text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 654 1152 30">
    <text x="64" y="676" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="14" fill="#5D6B7A">P16</text>
    <text x="1216" y="676" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="14" fill="#5D6B7A">通しの作業事例</text>
  </g>
</svg>
