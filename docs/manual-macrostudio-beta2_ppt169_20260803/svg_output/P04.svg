  <g id="screen-table" data-pptx-bounds="64 308 1152 300">
    <rect x="64" y="308" width="1152" height="36" fill="#F2F6FB"/>
    <text x="88" y="333" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#24507F">画面</text>
    <text x="184" y="333" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#24507F">名前</text>
    <text x="560" y="333" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#24507F">この画面で決めること</text>
    <text x="88" y="371" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" fill="#5D6B7A">0<tspan x="88" dy="26">1</tspan><tspan x="88" dy="26">2</tspan><tspan x="88" dy="26">3</tspan><tspan x="88" dy="26">4</tspan><tspan x="88" dy="26">5</tspan><tspan x="88" dy="26">6</tspan><tspan x="88" dy="26">7</tspan><tspan x="88" dy="26">8</tspan><tspan x="88" dy="26">9</tspan></text>
    <text x="184" y="371" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" fill="#1F2A37">Excelブックを読み込みます<tspan x="184" dy="26">AIに診断してもらいます</tspan><tspan x="184" dy="26">診断結果を確認します</tspan><tspan x="184" dy="26">次にすることを選びます</tspan><tspan x="184" dy="26">改修する内容を決めます</tspan><tspan x="184" dy="26">AIに改修してもらいます</tspan><tspan x="184" dy="26">取り込んだ変更を確認します</tspan><tspan x="184" dy="26">作成する改修済みブックを確認します</tspan><tspan x="184" dy="26">改修済みブックをビルドしています</tspan><tspan x="184" dy="26">改修済みブックを作成しました</tspan></text>
    <text x="560" y="371" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" fill="#5D6B7A">対象のブック<tspan x="560" dy="26">診断依頼の受け渡しと、診断結果の取り込み</tspan><tspan x="560" dy="26">診断結果を読む（要約・概要・見つかった事実）</tspan><tspan x="560" dy="26">次にすること（ひな形。複数選べる）</tspan><tspan x="560" dy="26">置き換える内容と、改修する指摘の確認</tspan><tspan x="560" dy="26">改修依頼の受け渡しと、改修返答の取り込み</tspan><tspan x="560" dy="26">変更内容の確認（差分）</tspan><tspan x="560" dy="26">出力ファイル名</tspan><tspan x="560" dy="26">（自動）</tspan><tspan x="560" dy="26">出力フォルダを開く／完了</tspan></text>
  </g>

  <g id="branch-note" data-pptx-bounds="64 612 1152 40">
    <text x="64" y="642" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" fill="#5D6B7A">分岐は 2 か所だけです。どちらも画面は増えず、前へ進むボタンはどの画面でも［次へ］です。</text>
