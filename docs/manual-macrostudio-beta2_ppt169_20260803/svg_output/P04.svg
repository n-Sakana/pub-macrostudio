    <text x="680" y="228" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#FFFFFF">手順 3</text>
    <text x="680" y="258" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">改修を決めて実行する</text>
