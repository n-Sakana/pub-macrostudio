    <text x="976" y="228" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#FFFFFF">手順 4</text>
    <text x="976" y="258" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">ブックを作る</text>
