<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration"/>

  <g id="page-head" data-pptx-bounds="64 44 1152 140">
    <rect x="64" y="52" width="196" height="28" rx="14" fill="#24507F"/>
    <text x="80" y="72" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="15" fill="#FFFFFF">手順 3 ・ 画面 4 上段</text>
    <text x="64" y="128" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="40" font-weight="700" fill="#1F2A37">置き換える内容を確認します</text>
    <text x="64" y="164" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#5D6B7A">何を候補として拾うかはひな形が決めます。新しい値を決めるのは、いつも人です。</text>
    <rect x="64" y="180" width="1152" height="1" fill="#CFD7DE"/>
  </g>

  <g id="shot-table" data-pptx-bounds="64 200 560 372">
    <rect x="64" y="200" width="560" height="336" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image x="80" y="216" width="528" height="297" href="images/12-repairinput-table.png" preserveAspectRatio="xMidYMid meet"/>
    <text x="64" y="562" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" fill="#5D6B7A">6 種類・6 か所の候補。件数と呼び方が並びます。</text>
  </g>

  <g id="shot-filled" data-pptx-bounds="656 200 560 372">
    <rect x="656" y="200" width="560" height="336" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image x="672" y="216" width="528" height="297" href="images/13-repairinput-filled.png" preserveAspectRatio="xMidYMid meet"/>
    <text x="656" y="562" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" fill="#5D6B7A">値を入れたところ。場所を指す候補には［選ぶ］が出ます。</text>
  </g>

  <g id="context-note" data-pptx-bounds="64 578 1152 70">
    <rect x="64" y="578" width="1152" height="68" rx="10" fill="#FFFFFF" stroke="#CFD7DE" stroke-width="1"/>
    <rect x="64" y="578" width="5" height="68" rx="2.5" fill="#C05B21"/>
    <text x="92" y="608" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" fill="#1F2A37">CreateObject("Scripting.FileSystemObject") の中の文字列は候補に出ません。<tspan x="92" dy="26">ひな形が「この文脈では拾わない」と書いているためです。</tspan></text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 654 1152 30">
    <text x="64" y="676" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="14" fill="#5D6B7A">P14</text>
    <text x="1216" y="676" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="14" fill="#5D6B7A">通しの作業事例</text>
  </g>
</svg>
