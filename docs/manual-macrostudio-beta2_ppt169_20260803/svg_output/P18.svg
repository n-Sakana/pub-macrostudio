<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration"/>

  <g id="page-head" data-pptx-bounds="64 44 1152 140">
    <rect x="64" y="52" width="150" height="28" rx="14" fill="#24507F"/>
    <text x="80" y="72" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="15" fill="#FFFFFF">手順 4 ・ 画面 7</text>
    <text x="64" y="128" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="40" font-weight="700" fill="#1F2A37">作成する改修済みブックを確認します</text>
    <text x="64" y="164" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#5D6B7A">名前が使えないときは、赤枠と理由が必ず一緒に出ます。</text>
    <rect x="64" y="180" width="1152" height="1" fill="#CFD7DE"/>
  </g>

  <g id="shot-output" data-pptx-bounds="64 200 560 360">
    <rect x="64" y="200" width="560" height="320" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image x="80" y="216" width="528" height="297" href="images/18-output.png" preserveAspectRatio="xMidYMid meet"/>
    <text x="64" y="546" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" fill="#5D6B7A">既定の名前が入っています。拡張子は元のままです。</text>
  </g>

  <g id="shot-reserved" data-pptx-bounds="656 200 560 360">
    <rect x="656" y="200" width="560" height="320" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image x="672" y="216" width="528" height="297" href="images/19-output-reserved-name.png" preserveAspectRatio="xMidYMid meet"/>
    <text x="656" y="546" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" fill="#5D6B7A">Windows が装置の名前として扱う名前を入れたところ。</text>
  </g>

  <g id="name-rules" data-pptx-bounds="64 572 1152 76">
    <rect x="64" y="572" width="1152" height="72" rx="10" fill="#F2F6FB"/>
    <text x="88" y="602" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#24507F">使えない名前</text>
    <text x="88" y="630" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#1F2A37">フォルダの区切りや \ / : * ? " &lt; &gt; | ／ 貼り付けで混ざった制御文字 ／ 120 文字超 ／ CON PRN AUX NUL CLOCK$ COM0〜COM9 LPT0〜LPT9</text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 654 1152 30">
    <text x="64" y="676" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="14" fill="#5D6B7A">P18</text>
    <text x="1216" y="676" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="14" fill="#5D6B7A">通しの作業事例</text>
  </g>
</svg>
