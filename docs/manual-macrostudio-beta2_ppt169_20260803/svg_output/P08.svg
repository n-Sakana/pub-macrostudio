<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration"/>

  <g id="page-head" data-pptx-bounds="64 44 1152 140">
    <rect x="64" y="52" width="150" height="28" rx="14" fill="#24507F"/>
    <text x="80" y="72" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="15" fill="#FFFFFF">手順 1 ・ 画面 0</text>
    <text x="64" y="128" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="40" font-weight="700" fill="#1F2A37">読み取った内容を確認します</text>
    <text x="64" y="164" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#5D6B7A">読み取りに疑いがある場合は、そのことが画面に出ます。</text>
    <rect x="64" y="180" width="1152" height="1" fill="#CFD7DE"/>
  </g>

  <g id="shot-modules" data-pptx-bounds="64 200 700 448">
    <rect x="64" y="200" width="700" height="420" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image x="80" y="216" width="668" height="376" href="images/03-book-modules.png" preserveAspectRatio="xMidYMid meet"/>
    <text x="64" y="640" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5D6B7A">「読み取ったコード」を開いたところ。</text>
  </g>

  <g id="read-notes" data-pptx-bounds="796 200 420 448">
    <rect x="796" y="200" width="420" height="200" rx="10" fill="#F2F6FB"/>
    <text x="820" y="238" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#24507F">読み取り結果は 2 段階</text>
    <text x="820" y="272" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" fill="#1F2A37">「マクロのコードは全モジュール<tspan x="820" dy="26">読み取れています。」なら、</tspan><tspan x="820" dy="26">問題は管理情報だけで、コードの</tspan><tspan x="820" dy="26">読み取りには影響していません。</tspan></text>
    <rect x="796" y="424" width="420" height="196" rx="10" fill="none" stroke="#E2E7EC" stroke-width="1"/>
    <text x="820" y="462" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#24507F">コードの外にあるもの</text>
    <text x="820" y="496" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" fill="#1F2A37">参照設定・署名・外部リンクなど、<tspan x="820" dy="26">VBA には現れない事実です。</tspan><tspan x="820" dy="26">このツールは直しません。次の診断</tspan><tspan x="820" dy="26">の依頼文へ自動で入ります。</tspan></text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 654 1152 30">
    <text x="64" y="676" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="14" fill="#5D6B7A">P08</text>
    <text x="1216" y="676" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="14" fill="#5D6B7A">通しの作業事例</text>
  </g>
</svg>
