<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration"/>

  <g id="page-head" data-pptx-bounds="64 44 1152 140">
    <rect x="64" y="52" width="140" height="28" rx="14" fill="#24507F"/>
    <text x="80" y="72" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="15" fill="#FFFFFF">別の進め方</text>
    <text x="64" y="128" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="40" font-weight="700" fill="#1F2A37">診断を飛ばす／戻ってやり直す</text>
    <text x="64" y="164" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#5D6B7A">完了画面から戻っても、作成済みのファイルはそのまま残っています。</text>
    <rect x="64" y="180" width="1152" height="1" fill="#CFD7DE"/>
  </g>

  <g id="shot-skip" data-pptx-bounds="64 200 560 384">
    <rect x="64" y="200" width="560" height="336" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image x="80" y="216" width="528" height="297" href="images/30-diagnose-skip.png" preserveAspectRatio="xMidYMid meet"/>
    <text x="64" y="566" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" fill="#5D6B7A">「診断を飛ばして、直したいことを自分で書く」を選んだところ。</text>
  </g>

  <g id="shot-back" data-pptx-bounds="656 200 560 384">
    <rect x="656" y="200" width="560" height="336" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image x="672" y="216" width="528" height="297" href="images/23-back-after-done.png" preserveAspectRatio="xMidYMid meet"/>
    <text x="656" y="566" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="17" fill="#5D6B7A">完了画面から［戻る］で戻った先。上部に案内が出ます。</text>
  </g>

  <g id="skip-note" data-pptx-bounds="64 596 560 52">
    <rect x="64" y="596" width="560" height="48" rx="10" fill="#F2F6FB"/>
    <text x="88" y="626" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#1F2A37">診断結果のページを飛ばして、次にすることの選択へ進みます。</text>
  </g>

  <g id="back-note" data-pptx-bounds="656 596 560 52">
    <rect x="656" y="596" width="560" height="48" rx="10" fill="#F2F6FB"/>
    <text x="680" y="626" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#1F2A37">このまま進めると、同じフォルダーへもう一度作成します。</text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 654 1152 30">
    <text x="64" y="676" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="14" fill="#5D6B7A">P21</text>
    <text x="1216" y="676" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="14" fill="#5D6B7A">確かめること・別の進め方</text>
  </g>
</svg>
