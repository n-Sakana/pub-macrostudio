<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="ending">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background" />
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration" />

  <g id="page-head" data-pptx-bounds="64 60 1152 116">
    <text x="64" y="108" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="40" font-weight="700" fill="#1F2A37">動作要件と、仕組みの要点</text>
    <text x="64" y="148" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="22" fill="#5D6B7A">MacroStudio 自体の処理は手元で完結します。チャット AI は外部サービスです。</text>
    <rect x="64" y="168" width="1152" height="1" fill="#CFD7DE" />
  </g>

  <g id="requirements" data-pptx-bounds="64 192 368 320">
    <text x="64" y="220" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#24507F">動作要件</text>
    <rect x="64" y="236" width="368" height="272" rx="10" fill="#F2F6FB" />
    <text font-size="18" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="88" y="276">Windows</text><text font-size="18" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="88" y="312">WebView2 Runtime</text><text font-size="18" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="88" y="348">Excel（動作確認用）</text><text font-size="18" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="88" y="384">dotnet SDK は不要</text><text font-size="18" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="88" y="420">フォルダをコピーするだけで動く</text><text font-size="18" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="88" y="456">外部依存はありません</text></g>

  <g id="local-scope" data-pptx-bounds="456 192 368 320">
    <text x="456" y="220" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#24507F">手元で完結すること</text>
    <rect x="456" y="236" width="368" height="272" rx="10" fill="#F2F6FB" />
    <text font-size="18" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="480" y="276">ブックの読み取り</text><text font-size="18" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="480" y="312">依頼文と添付ファイルの作成</text><text font-size="18" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="480" y="348">返答の検証</text><text font-size="18" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="480" y="384">固定パスの検出と置き換え</text><text font-size="18" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="480" y="420">差分の作成</text><text font-size="18" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="480" y="456">書き戻しと読み直し検証</text></g>

  <g id="mechanism" data-pptx-bounds="848 192 368 336">
    <text x="848" y="220" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#24507F">仕組みの要点</text>
    <rect x="848" y="236" width="368" height="288" rx="10" fill="none" stroke="#E2E7EC" stroke-width="1" />
    <text font-size="17" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="872" y="270">依頼と返答は依頼 ID で</text><text font-size="17" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="872" y="295">対応付けます。</text><text font-size="17" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="872" y="329">別の依頼への返答は</text><text font-size="17" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="872" y="354">受理しません。</text><text font-size="17" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="872" y="388">前提が変わった結果は</text><text font-size="17" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="872" y="413">捨てます。</text><text font-size="17" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="872" y="447">出力は常に別名の新しい</text><text font-size="17" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="872" y="472">ブックで、実行フォルダの</text><text font-size="17" fill="#1F2A37" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="872" y="497">中だけに作ります。</text></g>

  <g id="closing" data-pptx-bounds="64 536 1152 108">
    <rect x="64" y="536" width="1152" height="100" rx="10" fill="#FFFFFF" stroke="#CFD7DE" stroke-width="1" />
    <rect x="64" y="536" width="5" height="100" rx="2.5" fill="#24507F" />
    <text x="92" y="574" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#24507F">何をするかは、マクロを見てから決める。</text>
    <text x="92" y="608" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#1F2A37">読み込んで、診断して、何をするか決めて、ブックを作る。元のブックは、そのあいだ一度も変わりません。</text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 654 1152 30">
    <text x="64" y="676" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="14" fill="#5D6B7A">P22</text>
    <text x="1216" y="676" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="14" fill="#5D6B7A">MacroStudio beta 2.0.0</text>
  </g>
</svg>