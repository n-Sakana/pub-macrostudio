<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MacroStudio beta 2.0.0</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/flow.css">
  <link rel="stylesheet" href="css/module-list.css">
  <link rel="stylesheet" href="css/diff.css">
  <link rel="stylesheet" href="css/findings.css">
  <link rel="stylesheet" href="css/path-map.css">
  <link rel="stylesheet" href="css/code-view.css">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("macrostudio.theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (error) {
      }
    }());
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">メイン画面へ移動</a>

  <div class="app-shell" id="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="MacroStudio ベータ版 2.0.0">
        <span class="brand-mark" aria-hidden="true">MS</span>
        <span class="brand-text">
          <span class="brand-name">MacroStudio</span>
          <span class="brand-beta">beta 2.0.0</span>
        </span>
      </div>

      <nav class="progress-nav" aria-label="改修の進捗">
        <ol class="progress-list" id="progress-list"></ol>
      </nav>

      <div class="top-actions">
        <button class="icon-button" type="button" data-action="restart">
          <svg class="topbar-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 4v6h6"></path>
            <path d="M5.5 15a8 8 0 1 0 .8-7.7L4 10"></path>
          </svg>
          <span>最初から</span>
        </button>
        <button
          class="icon-button icon-button--square"
          id="theme-toggle"
          type="button"
          aria-label="テーマを切り替える（現在: ライト）"
          title="テーマを切り替える（現在: ライト）">
          <svg class="theme-icon theme-icon--moon" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6 6 0 1 0 8 8Z"></path>
          </svg>
          <svg class="theme-icon theme-icon--sun" viewBox="0 0 20 20" aria-hidden="true" hidden>
            <circle cx="10" cy="10" r="3.25"></circle>
            <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.35 4.35l1.4 1.4M14.25 14.25l1.4 1.4M15.65 4.35l-1.4 1.4M5.75 14.25l-1.4 1.4"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <main class="main-region" id="main-content" tabindex="-1"></main>

    <footer class="actionbar">
      <p class="action-context">
        <span class="context-dot" aria-hidden="true"></span>
        <span id="action-context"></span>
      </p>
      <div class="actions nav-actions" id="footer-actions"></div>
    </footer>
  </div>

  <dialog class="flow-modal" id="discard-modal" aria-labelledby="discard-modal-title">
    <div class="flow-modal-content">
      <h2 id="discard-modal-title">取り込み済みの内容を破棄しますか？</h2>
      <p>取り込んだ変更は失われます。元のブックは変更されません。</p>
      <div class="actions">
        <button
          class="button"
          id="discard-modal-cancel"
          type="button">やめる</button>
        <button
          class="button button--danger"
          id="discard-modal-confirm"
          type="button">破棄して進む</button>
      </div>
    </div>
  </dialog>

  <dialog class="flow-modal" id="edit-discard-modal" aria-labelledby="edit-discard-modal-title">
    <div class="flow-modal-content">
      <h2 id="edit-discard-modal-title">未反映の修正を破棄しますか？</h2>
      <p>手動修正でまだ反映していない変更があります。このまま進むと破棄されます。</p>
      <div class="actions">
        <button
          class="button"
          id="edit-discard-cancel"
          type="button">編集に戻る</button>
        <button
          class="button button--danger"
          id="edit-discard-confirm"
          type="button">破棄して続行</button>
      </div>
    </div>
  </dialog>

  <dialog class="flow-modal" id="decision-modal" aria-labelledby="decision-modal-title">
    <div class="flow-modal-content">
      <h2 id="decision-modal-title"></h2>
      <p id="decision-modal-body"></p>
      <div class="actions">
        <button
          class="button"
          id="decision-modal-cancel"
          type="button">画面へ戻る</button>
        <button
          class="button button--primary"
          id="decision-modal-confirm"
          type="button">採用する</button>
      </div>
    </div>
  </dialog>

  <div class="status-announcer" id="status-announcer" aria-live="polite"></div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="js/theme.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/host-bridge.js"></script>
  <script src="js/target-environment.js"></script>
  <script src="js/handover.js"></script>
  <script src="js/preset-document.js"></script>
  <script src="js/response-package.js"></script>
  <script src="js/diagnosis-package.js"></script>
  <script src="js/prompt-template.js"></script>
  <script src="js/diff.js"></script>
  <script src="js/vba-highlight.js"></script>
  <script src="js/vba-lexer.js"></script>
  <script src="js/path-map.js"></script>
  <script src="js/diff-report.js"></script>
  <script src="js/diff-view.js"></script>
  <script src="js/code-view.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/state.js"></script>
  <script src="js/screens/workflow.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
