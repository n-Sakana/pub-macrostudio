.screen {
  display: grid;
  width: 100%;
  height: 100%;
  min-height: 0;
  grid-template-rows: var(--screen-header-h) minmax(0, 1fr);
}

.screen-enter-forward {
  animation: screen-enter-forward var(--transition-slow) both;
}

.screen-enter-back {
  animation: screen-enter-back var(--transition-slow) both;
}

@keyframes screen-enter-forward {
  from {
    opacity: 0;
    transform: translateX(var(--space-4));
  }

  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes screen-enter-back {
  from {
    opacity: 0;
    transform: translateX(calc(-1 * var(--space-4)));
  }

  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.workspace {

  min-height: 0;
  overflow: hidden;
  padding: var(--space-6);
}

.workspace.screen-body {
  overflow-x: hidden;
  overflow-y: auto;
}

.screen-body .task {
  max-height: none;
}

.workspace--centered {
  display: grid;
  align-items: start;
  justify-items: center;
}

.workspace--code {
  display: block;
}

/* The intake and review screens fill the height: the module pane and
   the code panel both scroll inside themselves. */
.workspace-code {
  display: grid;
  height: 100%;
  min-height: 0;
  gap: var(--space-3);
  grid-template-rows: auto minmax(0, 1fr);
}

.workspace-code .task-intro {
  margin: 0;
}

.task {
  display: flex;
  width: min(var(--content-flow-w), 100%);
  max-height: 100%;
  min-height: 0;
  flex-direction: column;
}

.task--wide {
  width: min(var(--content-flow-wide-w), 100%);
}

/* Nothing in the flow is allowed to push the screen sideways. A long
   identifier, a long path or a long Japanese sentence wraps in place.
   break-word, not anywhere: the shortest line a box may be squeezed to
   stays the longest word, so a box can never end up one glyph wide. */
.task p,
.task li,
.task span,
.task strong,
.task code,
.task h2,
.task h3,
.task label {
  overflow-wrap: break-word;
}

.task--fill {
  height: 100%;
}

.task-intro {
  margin: 0 0 var(--space-4);
  color: var(--text-sub);
  font-size: var(--type-body-size);
  line-height: var(--type-body-line);
}

.task-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: var(--space-3);
}

.panel {
  min-width: 0;
  min-height: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.panel-header {

  font-weight: var(--weight-semibold);
  gap: var(--space-2);
}

.toolbar-spacer {

}

/* ---- buttons: one normal size and one compact size ---- */

.button {
  display: inline-flex;
  height: var(--btn-h);
  align-items: center;
  justify-content: center;
  padding: 0 var(--space-4);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text-sub);
  font-size: var(--type-label-size);
  font-weight: var(--weight-semibold);
  gap: var(--space-2);
}

/* Colour, lift and shadow move together, so a press reads as a press
   instead of a colour flicker. */
.button {
  transition:
    background var(--transition-fast),
    border-color var(--transition-fast),
    color var(--transition-fast),
    box-shadow var(--transition-fast),
    transform var(--transition-fast);
  will-change: transform;
}

.button:hover:not(:disabled) {
  border-color: var(--border-strong);
  background: var(--surface-hover);
  box-shadow: var(--shadow-1);
  color: var(--text);
  transform: translateY(-1px);
}

.button:active:not(:disabled) {
  box-shadow: none;
  transform: translateY(1px);
  transition-duration: 60ms;
}

.button--primary {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--text-on-accent);
}

.button--primary:hover:not(:disabled) {
  border-color: var(--accent-hover);
  background: var(--accent-hover);
  box-shadow: var(--shadow-2);
  color: var(--text-on-accent);
}

.button--danger {
  border-color: var(--danger);
  background: transparent;
  color: var(--danger-text);
}

.button--danger:hover:not(:disabled) {
  border-color: var(--danger);
  background: var(--danger-soft);
  color: var(--danger-text);
}

.button--compact {
  height: var(--btn-h-sm);
  padding: 0 var(--space-3);
  font-size: var(--type-meta-size);
}

.button:disabled {
  border-color: var(--border-subtle);
  background: var(--surface-sunken);
  box-shadow: none;
  color: var(--text-disabled);
  cursor: not-allowed;
  transform: none;
}

.button.is-done {
  border-color: var(--success);
  background: var(--success-soft);
  color: var(--success-text);
}

  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.6;
}

.flow-icon--small {
  width: var(--icon-sm);
  height: var(--icon-sm);
}

.loading-spinner {
  width: var(--spinner-size);
  height: var(--spinner-size);
  flex: 0 0 auto;
  border: var(--spinner-border-w) solid var(--border);
  border-radius: var(--radius-pill);
  border-top-color: var(--accent);
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* ---- screen 0 / 1: the workbook ---- */

.drop-zone {
  display: grid;
  min-height: var(--editor-min-h);
  flex: 1 1 auto;
  place-items: center;
  padding: var(--space-7);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface-sunken);
  text-align: center;
}

.drop-zone:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--surface-selected);
}

.drop-zone h2 {
  margin: 0 0 var(--space-2);
  font-size: var(--type-title-size);
  font-weight: var(--weight-bold);
}

.drop-zone p,
.paste-target p {
  margin: 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

.drop-icon {
  display: grid;
  width: var(--success-icon-size);
  height: var(--success-icon-size);
  margin: 0 auto var(--space-3);
  place-items: center;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  color: var(--accent-text);
}

.drop-icon svg {
  width: var(--icon-lg);
  height: var(--icon-lg);
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.6;
}

.loaded-zone {
  display: flex;
  min-height: var(--editor-min-h);
  align-items: center;
  padding: var(--space-6);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  gap: var(--space-4);
}

.loaded-zone .drop-icon {
  margin: 0;
}

.loaded-zone-details {
  min-width: 0;
  flex: 1 1 auto;
}

.loaded-zone h2 {
  margin: 0;
  font-size: var(--type-title-size);
}

.loaded-zone-path {
  margin: var(--space-1) 0 0;
  overflow: hidden;
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.inline-error-card {
  margin-bottom: var(--space-3);
  padding: var(--space-4);
  border: 1px solid var(--danger);
  border-radius: var(--radius-md);
  background: var(--danger-soft);
}

.inline-error-code {
  color: var(--danger-text);
  font-family: var(--font-code);
  font-size: var(--type-micro-size);
}

.inline-error-card h2 {
  margin: var(--space-1) 0;
  font-size: var(--type-section-size);
}

.inline-error-card p {
  margin: 0;
  color: var(--text-sub);
  font-size: var(--type-meta-size);
}

.book-panel {
  overflow: hidden;
}

.book-main {
  display: grid;
  align-items: stretch;
  padding: var(--space-4);
  gap: var(--space-3);
  grid-template-columns:
    minmax(0, 1fr)
    repeat(3, var(--stat-card-w));
}

.file-card,
.stat-card {
  min-width: 0;
  padding: var(--space-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--surface-sunken);
}

.file-name {
  display: flex;
  align-items: center;
  color: var(--text);
  font-weight: var(--weight-bold);
  gap: var(--space-2);
}

.file-kind {
  display: grid;
  width: var(--file-kind-size);
  height: var(--file-kind-size);
  flex: 0 0 auto;
  place-items: center;
  border-radius: var(--radius-sm);
  background: var(--success-soft);
  color: var(--success-text);
  font-size: var(--type-micro-size);
}

.file-path {
  margin-top: var(--space-2);
  overflow: hidden;
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.stat-label {
  color: var(--text-muted);
  font-size: var(--type-micro-size);
}

.stat-value {
  margin-top: var(--space-1);
  color: var(--text);
  font-size: var(--type-num-size);
  font-weight: var(--weight-bold);
}

.module-strip {
  display: grid;
  padding: 0 var(--space-4) var(--space-4);
  gap: var(--space-2);
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.module-chip {
  min-width: 0;
  padding: var(--space-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--surface-sunken);
  color: var(--text-sub);
  font-family: var(--font-code);
  font-size: var(--type-meta-size);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---- screen 2 / 3: how the request is written ---- */

.choice-list {
  display: grid;
  gap: var(--space-3);
}

/* Four columns, each sized for what it holds: the checkbox, the icon,
   the words, and the mark. The mark column takes its own width, so a
   label in it cannot be pushed past the card's edge. */
.choice-card {
  display: grid;
  width: 100%;
  min-height: var(--card-min-h);
  align-items: center;
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  gap: var(--space-3);
  grid-template-columns: auto var(--icon-xl) minmax(0, 1fr) auto;
  text-align: left;
}

.choice-card {
  transition:
    background var(--transition-fast),
    border-color var(--transition-fast),
    box-shadow var(--transition-normal),
    transform var(--transition-normal);
}

.choice-card:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--surface-hover);
  box-shadow: var(--shadow-1);
  transform: translateY(-1px);
}

.choice-card:active:not(:disabled) {
  box-shadow: none;
  transform: translateY(0);
  transition-duration: 60ms;
}

.choice-card.is-selected {
  border-color: var(--accent);
  background: var(--surface-selected);
  box-shadow: inset var(--rail-w) 0 0 var(--accent);
}

/* The check does not pop in: it grows into place. */
.choice-card.is-selected .choice-state .flow-icon {
  animation: choice-check var(--transition-normal) both;
}

@keyframes choice-check {
  from {
    opacity: 0;
    transform: scale(.7);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

.choice-card .choice-icon {
  transition:
    background var(--transition-fast),
    border-color var(--transition-fast),
    color var(--transition-fast);
}

.choice-card:hover:not(:disabled) .choice-icon,
.choice-card.is-selected .choice-icon {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.choice-icon {
  display: grid;
  width: var(--icon-xl);
  height: var(--icon-xl);
  place-items: center;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-sunken);
  color: var(--accent-text);
}

.choice-title {
  display: block;
  margin-bottom: var(--space-1);
  color: var(--text);
  font-weight: var(--weight-bold);
}

.choice-description {
  display: block;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
  line-height: var(--type-label-line);
}

/* A card cannot hold a real input, so the box is drawn. It has to read
   as the same control as every other checkbox in the flow, because it
   is the same decision: this one, and possibly that one too. */
.choice-checkbox {
  display: grid;
  width: var(--intake-step-number-size);
  height: var(--intake-step-number-size);
  place-items: center;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text-on-accent);
}

.choice-card.is-selected .choice-checkbox {
  border-color: var(--accent);
  background: var(--accent);
}

.choice-card:hover:not(:disabled) .choice-checkbox {
  border-color: var(--accent);
}

.choice-state,
.preset-check {
  display: grid;
  place-items: center;
  color: var(--accent-text);
}

.is-selected .choice-state,
.is-selected .preset-check {
  animation: check-in var(--transition-fast) both;
}

@keyframes check-in {
  from {
    opacity: 0;
    transform: scale(.7);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

.preset-list {
  min-height: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  overflow: auto;
}

.preset {
  display: grid;
  width: 100%;
  min-height: var(--preset-min-h);
  align-items: center;
  padding: var(--space-3);
  border: 0;
  border-bottom: 1px solid var(--border-subtle);
  background: transparent;
  gap: var(--space-3);
  grid-template-columns: minmax(0, 1fr) var(--icon-xl);
  text-align: left;
}

.preset:last-child {
  border-bottom: 0;
}

.preset:hover:not(:disabled) {
  background: var(--surface-selected);
}

.preset.is-selected {
  background: var(--surface-selected);
}

.preset-name {
  display: block;
  margin-bottom: var(--space-half);
  color: var(--text);
  font-weight: var(--weight-semibold);
}

.preset-note {
  display: block;
  overflow: hidden;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.preset-empty {
  margin: 0;
  padding: var(--space-5);
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

.preset-invalid {
  margin-top: var(--space-3);
  padding: var(--space-3);
  border: 1px dashed var(--danger);
  border-radius: var(--radius-sm);
  background: var(--surface-sunken);
}

.preset-invalid-label {
  margin: 0;
  color: var(--danger-text);
  font-size: var(--type-meta-size);
}

.preset-invalid-list {
  margin: var(--space-2) 0 0;
  padding-left: var(--space-5);
  color: var(--text-sub);
  font-size: var(--type-meta-size);
}

.preset-invalid-file {
  margin-right: var(--space-2);
  color: var(--text);
  font-family: var(--font-code);
}

/* ---- screen 4: the request editor ---- */

.editor-panel {
  display: grid;
  flex: 1 1 auto;
  overflow: hidden;
  grid-template-rows: var(--row-h) minmax(0, 1fr);
}

.editor-meta {
  margin-left: auto;
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  font-weight: var(--weight-regular);
}

.request-editor {
  width: 100%;
  height: 100%;
  min-height: var(--editor-min-h);
  padding: var(--space-4);
  border: 0;
  background: var(--surface);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: var(--type-body-size);
  line-height: var(--type-body-line);
  outline: 0;
  resize: none;
}

.editor-note {
  margin: var(--space-3) 0 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

.output-rules-details {
  margin-top: var(--space-3);
  overflow: hidden;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.output-rules-summary {
  display: flex;
  min-height: var(--btn-h-sm);
  align-items: center;
  padding: 0 var(--space-3);
  color: var(--text-sub);
  cursor: pointer;
  font-size: var(--type-meta-size);
  gap: var(--space-2);
  list-style: none;
}

.output-rules-summary::-webkit-details-marker {
  display: none;
}

.output-rules-summary::after {
  margin-left: auto;
  color: var(--text-muted);
  content: "⌄";
}

.output-rules-body {
  max-height: var(--textarea-max-h);
  padding: var(--space-3);
  border-top: 1px solid var(--border-subtle);
  margin: 0;
  overflow: auto;
  color: var(--text-sub);
  font-family: var(--font-code);
  font-size: var(--type-code-size);
  line-height: var(--type-code-line);
  white-space: pre-wrap;
}

.output-rules-note {
  margin: 0;
  padding: var(--space-2) var(--space-3) var(--space-3);
  color: var(--text-muted);
  font-size: var(--type-micro-size);
}

/* ---- screen 5: hand over to the chat ---- */

.handoff {
  display: grid;
  gap: var(--space-3);
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.handoff-card {
  min-width: 0;
  padding: var(--space-4);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.handoff-card.is-done {
  border-color: var(--success);
}

.handoff-number {
  display: grid;
  width: var(--handoff-number-size);
  height: var(--handoff-number-size);
  place-items: center;
  border-radius: var(--radius-pill);
  background: var(--surface-sunken);
  color: var(--text-sub);
  font-size: var(--type-meta-size);
  font-weight: var(--weight-bold);
}

.handoff-card.is-done .handoff-number {
  background: var(--success-soft);
  color: var(--success-text);
}

.handoff-card h2 {
  margin: var(--space-3) 0 var(--space-2);
  font-size: var(--type-section-size);
  font-weight: var(--weight-bold);
}

.handoff-card p {
  margin: 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
  line-height: var(--type-label-line);
}

.file-pill {
  margin-top: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--surface-sunken);
  color: var(--text-sub);
  font-family: var(--font-code);
  font-size: var(--type-meta-size);
}

.inline-actions {
  display: flex;
  margin-top: var(--space-3);
}

.inline-actions .button {
  min-width: var(--control-min-w);
}

.folder-contract {
  margin-top: var(--space-3);
  padding: var(--space-3) var(--space-4) var(--space-4);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.folder-contract-title {
  display: flex;
  align-items: center;
  color: var(--text-sub);
  font-size: var(--type-meta-size);
  font-weight: var(--weight-semibold);
  gap: var(--space-2);
}

.folder-path {
  margin-top: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  background: var(--surface-sunken);
  color: var(--text);
  font-family: var(--font-code);
  font-size: var(--type-meta-size);
  overflow-wrap: anywhere;
}

.artifact-chips {
  display: flex;
  flex-wrap: wrap;
  margin-top: var(--space-3);
  gap: var(--space-2);
}

.artifact-chip {
  padding: var(--space-1) var(--space-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-pill);
  background: var(--surface-sunken);
  color: var(--text-muted);
  font-family: var(--font-code);
  font-size: var(--type-micro-size);
}

/* ---- screens 6 / 7: intake and review ---- */

.code-layout {
  display: grid;
  min-width: 0;
  min-height: 0;
  gap: var(--space-3);
  grid-template-columns: var(--module-pane-w) minmax(0, 1fr);
}

.paste-panel {
  display: grid;
  min-width: 0;
  min-height: 0;
  grid-template-rows: var(--row-h) minmax(0, 1fr);
  overflow: hidden;
}

.intake-body {
  display: flex;
  min-height: 0;
  flex-direction: column;
  padding: var(--space-4);
  gap: var(--space-4);
  overflow: auto;
}

.intake-guide {
  display: grid;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface-sunken);
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.intake-step {
  display: flex;
  align-items: center;
  padding: var(--space-3);
  border-right: 1px solid var(--border-subtle);
  color: var(--text-sub);
  font-size: var(--type-meta-size);
  gap: var(--space-2);
}

.intake-step:last-child {
  border-right: 0;
}

.intake-step-number {
  display: grid;
  width: var(--intake-step-number-size);
  height: var(--intake-step-number-size);
  flex: 0 0 auto;
  place-items: center;
  border-radius: var(--radius-pill);
  background: var(--accent-soft);
  color: var(--accent-text);
  font-size: var(--type-micro-size);
  font-weight: var(--weight-bold);
}

.intake-step-text strong {
  color: var(--text);
}

/* What has arrived so far when the answer comes one module at a time. */

.intake-parts {
  padding: var(--space-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface-sunken);
}

.intake-part-count {
  color: var(--text);
  font-size: var(--type-label-size);
  font-weight: var(--weight-semibold);
}

.intake-part-list {
  display: grid;
  margin-top: var(--space-2);
  gap: var(--space-1);
}

.intake-part-row {
  display: flex;
  align-items: center;
  color: var(--text-sub);
  font-size: var(--type-meta-size);
  gap: var(--space-2);
}

.intake-part-number {
  color: var(--text-muted);
  font-family: var(--font-code);
}

.intake-part-missing {
  margin: var(--space-2) 0 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

.paste-target {
  display: flex;
  flex: 1 1 auto;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: var(--space-6);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface-sunken);
  gap: var(--space-3);
  text-align: center;
}

.paste-target h2 {
  margin: 0;
  font-size: var(--type-section-size);
  font-weight: var(--weight-bold);
}

.paste-target-state {
  display: inline-flex;
  height: var(--badge-h);
  align-items: center;
  padding: 0 var(--space-2);
  border: 1px dashed var(--state-excluded);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  font-weight: var(--type-micro-weight);
}

.diff-review-column {
  display: grid;
  min-width: 0;
  min-height: 0;
  gap: var(--space-3);
  grid-template-rows: minmax(0, 1fr) auto;
}

.review-decision {
  display: flex;
  align-items: center;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  gap: var(--space-2);
}

.review-decision-note {
  flex: 1 1 auto;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

.new-module-intake {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  padding: var(--space-4);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface-sunken);
  gap: var(--space-3);
}

.new-module-field label {
  display: block;
  margin-bottom: var(--space-1);
  color: var(--text-sub);
  font-size: var(--type-meta-size);
  font-weight: var(--weight-semibold);
}

.new-module-input,
.text-input {
  width: 100%;
  height: var(--btn-h);
  padding: 0 var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  font-family: var(--font-code);
  font-size: var(--type-body-size);
}

.new-module-input:focus,
.text-input:focus {
  border-color: var(--focus-color);
  outline: none;
}

.new-module-input[aria-invalid="true"],
.text-input[aria-invalid="true"] {
  border-color: var(--danger);
}

.new-module-hint {
  margin: var(--space-2) 0 0;
  color: var(--text-muted);
  font-size: var(--type-micro-size);
}

.new-module-actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-2);
}

.region-kicker {
  margin: 0;
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  font-weight: var(--weight-semibold);
}

/* ---- screens 8 / 9: what will be built ---- */

.summary-grid {
  display: grid;
  margin-bottom: var(--space-3);
  gap: var(--space-3);
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.summary-card {
  padding: var(--space-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.table-wrap {
  max-height: var(--build-table-max-h);
  overflow: auto;
}

.flow-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--type-meta-size);
}

.flow-table th,
.flow-table td {
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--border-subtle);
  text-align: left;
}

.flow-table thead th {
  position: sticky;
  top: 0;
  background: var(--surface-sunken);
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  font-weight: var(--weight-semibold);
}

.flow-table-name code {
  font-family: var(--font-code);
}

.flow-table-lines {
  font-family: var(--font-code);
  font-variant-numeric: tabular-nums;
}

.flow-table-empty {
  color: var(--text-muted);
}

.new-badge,
.status-badge {
  display: inline-flex;
  align-items: center;
  padding: var(--space-half) var(--space-2);
  border-radius: var(--radius-pill);
  font-size: var(--type-micro-size);
  gap: var(--space-1);
}

.new-badge {
  margin-left: var(--space-2);
  background: var(--accent-soft);
  color: var(--accent-text);
}

.status-badge {
  background: var(--success-soft);
  color: var(--success-text);
}

.output-panel {
  padding: var(--space-4);
}

.field-label {
  display: block;
  margin-bottom: var(--space-2);
  color: var(--text-sub);
  font-size: var(--type-label-size);
  font-weight: var(--weight-semibold);
}

.field-help {
  margin: var(--space-2) 0 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

/* An optional choice on the request screen. It sits beside the main
   path, never in it: leaving it alone is the normal way through. */

.option-row {
  padding: var(--space-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface-sunken);
}

.option-label {
  display: flex;
  align-items: center;
  cursor: pointer;
  gap: var(--space-2);
}

.option-checkbox {
  width: var(--intake-step-number-size);
  height: var(--intake-step-number-size);
  flex: 0 0 auto;
  accent-color: var(--accent);
  cursor: pointer;
}

.option-text {
  color: var(--text);
  font-size: var(--type-label-size);
  font-weight: var(--weight-semibold);
}

.option-help {
  margin: var(--space-2) 0 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

/* ---- screen 10 / 11: build and result ---- */

.build-progress {
  display: flex;
  align-items: center;
  flex-direction: column;
  padding: var(--space-8) var(--space-6);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  gap: var(--space-3);
  text-align: center;
}

.spinner {
  width: var(--progress-spinner-size);
  height: var(--progress-spinner-size);
  border: var(--spinner-border-w) solid var(--border);
  border-radius: var(--radius-pill);
  border-top-color: var(--accent);
  animation: spin 1s linear infinite;
}

.build-progress h2 {
  margin: 0;
  font-size: var(--type-title-size);
}

.build-progress p {
  margin: 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

.build-bar {
  width: 100%;
  height: var(--build-bar-h);
  overflow: hidden;
  border-radius: var(--radius-pill);
  background: var(--surface-sunken);
}

.build-bar span {
  display: block;
  width: 40%;
  height: 100%;
  background: var(--accent);
  animation: build-move 1.4s ease-in-out infinite;
}

@keyframes build-move {
  from {
    transform: translateX(-100%);
  }

  to {
    transform: translateX(250%);
  }
}

.success-panel,
.failure-panel {
  padding: var(--space-6);
  text-align: center;
}

.failure-panel {
  text-align: left;
}

.success-icon {
  display: grid;
  width: var(--success-icon-size);
  height: var(--success-icon-size);
  margin: 0 auto var(--space-3);
  place-items: center;
  border-radius: var(--radius-pill);
  background: var(--success-soft);
  color: var(--success-text);
}

.success-icon svg {
  width: var(--icon-lg);
  height: var(--icon-lg);
}

.success-panel h2 {
  margin: 0 0 var(--space-2);
  font-size: var(--type-title-size);
}

.success-panel p {
  margin: 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

.completion-actions {
  display: flex;
  justify-content: center;
  margin-top: var(--space-4);
}

.result-list {
  margin-top: var(--space-4);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  text-align: left;
}

.result-row {
  display: flex;
  align-items: center;
  padding: var(--space-2) var(--space-3);
  border-top: 1px solid var(--border-subtle);
  color: var(--text-sub);
  font-size: var(--type-meta-size);
  gap: var(--space-2);
}

.result-row:first-child {
  border-top: 0;
}

.result-row .flow-icon {
  color: var(--success-text);
}

.result-row code {
  margin-left: auto;
  color: var(--text-muted);
  font-family: var(--font-code);
}

/* The short way in sits under the two main choices, at the far end of
   the row, so it is available without competing with them. */
.simple-start {
  display: flex;
  justify-content: flex-end;
  margin-top: var(--space-3);
}

.result-note {
  margin: var(--space-3) 0 0;
  color: var(--danger-text);
  font-size: var(--type-meta-size);
}

.failure-message {
  margin: 0 0 var(--space-3);
  color: var(--danger-text);
  font-size: var(--type-label-size);
}

.build-result-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--type-meta-size);
}

.build-result-table th,
.build-result-table td {
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--border-subtle);
  text-align: left;
}

.build-status-icon {
  display: inline-grid;
  width: var(--icon-md);
  height: var(--icon-md);
  place-items: center;
}

.build-status-icon svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.6;
}

.build-status-icon--success {
  color: var(--success-text);
}

.build-status-icon--error {
  color: var(--danger-text);
}

.build-status-icon--muted {
  color: var(--text-muted);
}

@media (max-width: 61.25em) {
  .handoff,
  .summary-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .module-strip {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .book-main {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* ---- progressive disclosure ---- */

.disclosure {
  margin-top: var(--space-3);
  overflow: hidden;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.disclosure-trigger {
  display: flex;
  width: 100%;
  min-height: var(--btn-h);
  align-items: center;
  padding: 0 var(--space-3);
  border: 0;
  background: transparent;
  color: var(--text-sub);
  font-size: var(--type-label-size);
  font-weight: var(--weight-semibold);
  gap: var(--space-2);
  text-align: left;
}

.disclosure-trigger:hover {
  background: var(--surface-hover);
  color: var(--text);
}

.disclosure-chevron {
  color: var(--text-muted);
  transition: transform var(--transition-normal);
}

.disclosure[data-open="true"] .disclosure-chevron {
  transform: rotate(90deg);
}

.disclosure-note {
  margin-left: auto;
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  font-weight: var(--weight-regular);
}

/* A row that opens onto a text field. It carries a pencil instead of a
   chevron, and while it is closed it wears the same inset the textarea
   inside it wears, so it reads as somewhere to write rather than as one
   more thing to read. */
.disclosure--writein > .disclosure-trigger {
  background: var(--surface-sunken);
  color: var(--text-sub);
  font-weight: var(--weight-regular);
}

.disclosure--writein[data-open="true"] > .disclosure-trigger {
  background: transparent;
  font-weight: var(--weight-semibold);
}

.disclosure-pencil {
  color: var(--text-muted);
}

/* The body grows in place instead of the page jumping. */
.disclosure-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--transition-slow);
}

.disclosure[data-open="true"] .disclosure-body {
  grid-template-rows: 1fr;
}

/* Closed content stays out of the tab order and the reading order. */
.disclosure-inner {
  min-height: 0;
  overflow: hidden;
  transition: visibility var(--transition-slow);
  visibility: hidden;
}

.disclosure[data-open="true"] .disclosure-inner {
  border-top: 1px solid var(--border-subtle);
  visibility: visible;
}

.disclosure--fill {
  display: flex;
  min-height: 0;
  flex-direction: column;
}

.disclosure--fill .disclosure-body {
  min-height: 0;
  transition: none;
}

.disclosure[data-open="true"].disclosure--fill {
  flex: 1 1 auto;
}

.disclosure[data-open="true"].disclosure--fill .disclosure-body {
  min-height: 0;
  flex: 1 1 auto;
  grid-template-rows: minmax(0, 1fr);
}

.disclosure--fill .disclosure-inner {
  min-height: 0;
  padding: var(--space-3);
}

.disclosure--fill .code-layout {
  height: 100%;
  min-height: 0;
}

/* ---- headline summaries ---- */

.headline-card {
  display: grid;
  align-items: center;
  padding: var(--space-4) var(--space-5);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  gap: 0 var(--space-3);
  grid-template-columns: var(--icon-xl) minmax(0, 1fr);
}

.headline-icon {
  display: grid;
  width: var(--icon-xl);
  height: var(--icon-xl);
  place-items: center;
  border-radius: var(--radius-pill);
  background: var(--success-soft);
  color: var(--success-text);
}

.headline-text {
  color: var(--text);
  font-size: var(--type-section-size);
  font-weight: var(--weight-bold);
}

.headline-preview,
.headline-note,
.headline-warning {
  margin: var(--space-1) 0 0;
  grid-column: 2;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
  line-height: var(--type-label-line);
}

/* Only a finding the user has to act on is coloured as a caution. A
   read that completed keeps the ordinary muted note colour. */
.headline-warning {
  color: var(--caution-text);
}

.read-detail {
  padding: var(--space-1) 0;
}

.read-note {
  margin: var(--space-2) 0 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
  line-height: var(--type-label-line);
}

.request-editor-wrap {
  display: flex;
  min-height: 0;
  flex-direction: column;
}

.request-editor-wrap .request-editor {
  min-height: var(--editor-min-h);
  border-bottom: 1px solid var(--border-subtle);
}

.request-editor-wrap .editor-note {
  margin: 0;
  padding: var(--space-3);
}

.review-empty {
  display: grid;
  height: 100%;
  place-items: center;
  margin: 0;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-md);
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

/* ---- what the answer says it did ---- */

.intake-result {
  display: flex;
  flex-direction: column;
}

.intake-summary {
  padding: var(--space-3);
}

.intake-summary-line {
  margin: 0;
  color: var(--text-sub);
  font-size: var(--type-body-size);
  line-height: var(--type-body-line);
}

.intake-summary-line:empty {
  height: var(--space-2);
}

/* ---- the consult form ---- */

/* One question at a time. The beads say how many questions there are,
   which one this is, and which are answered: numbered stops on one
   straight line. A long form keeps its ends and folds the middle. */
.bead-rail {
  display: flex;
  justify-content: center;
  padding: var(--space-2) 0 var(--space-6);
}

.bead-track {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
}

/* One straight thread, from the first stop to the last. */
.bead-track::before {
  position: absolute;
  z-index: 0;
  top: 50%;
  right: calc(var(--bead-size) / 2);
  left: calc(var(--bead-size) / 2);
  height: var(--bead-line-h);
  margin-top: calc(var(--bead-line-h) / -2);
  background: var(--border);
  content: "";
}

.bead {
  position: relative;
  z-index: 1;
  display: grid;
  width: var(--bead-size);
  height: var(--bead-size);
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-pill);
  background: var(--surface);
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  font-weight: var(--weight-semibold);
  transition:
    background var(--transition-fast),
    border-color var(--transition-fast),
    color var(--transition-fast),
    transform var(--transition-normal);
}

.bead:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent-text);
  transform: translateY(-1px);
}

.bead.is-answered {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent-text);
}

.bead.is-current {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: var(--shadow-1);
  color: var(--text-on-accent);
  transform: scale(1.18);
}

/* The folded middle is simply a longer run of thread. The numbers on
   either side already say what was skipped, so nothing is drawn. */
.bead-gap {
  width: calc(var(--bead-size) * 1.4);
  height: var(--bead-size);
  flex: 0 0 auto;
}

.question-card {
  display: grid;
  align-items: center;
  gap: var(--space-4);
  grid-template-columns: var(--btn-h) minmax(0, 1fr) var(--btn-h);
}

.question-arrow {
  display: grid;
  width: var(--btn-h);
  height: var(--btn-h);
  place-items: center;
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  background: var(--surface);
  color: var(--text-sub);
  transition:
    background var(--transition-fast),
    border-color var(--transition-fast),
    color var(--transition-fast),
    transform var(--transition-fast);
}

.question-arrow:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--surface-hover);
  color: var(--text);
  transform: scale(1.06);
}

.question-arrow:active:not(:disabled) {
  transform: scale(.96);
  transition-duration: 60ms;
}

.question-arrow:disabled {
  border-color: var(--border-subtle);
  color: var(--text-disabled);
  cursor: not-allowed;
}

.question-body {
  display: flex;
  min-width: 0;
  flex-direction: column;
  padding: var(--space-5);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  gap: var(--space-4);
}

.question-count {
  margin: 0;
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  font-weight: var(--weight-semibold);
  letter-spacing: .06em;
}

.question-text {
  margin: 0;
  color: var(--text);
  font-size: var(--type-section-size);
  font-weight: var(--weight-bold);
  line-height: var(--type-label-line);
}

.question-note {
  margin: var(--space-4) 0 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
  text-align: center;
}

.form-choices {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.form-chip {
  display: inline-flex;
  min-height: var(--btn-h);
  align-items: center;
  padding: 0 var(--space-4);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  background: var(--surface);
  color: var(--text-sub);
  font-size: var(--type-label-size);
  transition:
    background var(--transition-fast),
    border-color var(--transition-fast),
    color var(--transition-fast),
    transform var(--transition-fast);
}

.form-chip:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--surface-hover);
  color: var(--text);
  transform: translateY(-1px);
}

.form-chip:active:not(:disabled) {
  transform: translateY(1px);
  transition-duration: 60ms;
}

.form-chip.is-selected {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent-text);
  font-weight: var(--weight-semibold);
}

.form-textarea {
  width: 100%;
  padding: var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-sunken);
  color: var(--text);
  font-family: inherit;
  font-size: var(--type-body-size);
  line-height: var(--type-body-line);
  resize: none;
}

.form-textarea:focus {
  border-color: var(--accent);
  outline: none;
}

/* The code is not the whole picture: this points at the data too. */
.handoff-note {
  margin: var(--space-4) 0 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
  line-height: var(--type-label-line);
  text-align: center;
}

/* The module pane is the tree used by the intake and review screens. */
.module-pane {
  display: grid;
  min-width: 0;
  min-height: 0;
  grid-template-rows: auto minmax(0, 1fr) auto;
  overflow: hidden;
}

.module-pane-title {
  padding: var(--space-3);
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text-sub);
  font-size: var(--type-label-size);
  font-weight: var(--weight-semibold);
}

/* The tree is grouped by module kind, like the VBE project tree. */
.module-group-title {
  padding: var(--space-2) var(--space-3) 0;
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  font-weight: var(--weight-semibold);
  letter-spacing: .03em;
}

.module-list {
  min-height: 0;
  padding: var(--space-2);
  margin: 0;
  list-style: none;
  overflow: auto;
}

.module-item {
  display: grid;
  width: 100%;
  min-height: var(--row-h);
  align-items: center;
  padding: 0 var(--space-2);
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-sub);
  font-size: var(--type-meta-size);
  gap: var(--space-2);
  grid-template-columns: var(--space-2) minmax(0, 1fr) auto;
  text-align: left;
}

.module-item:hover:not(:disabled) {
  background: var(--surface-hover);
}

.module-item.is-active {
  background: var(--surface-selected);
  color: var(--accent-text);
  font-weight: var(--weight-semibold);
}

.module-dot {
  width: var(--space-2);
  height: var(--space-2);
  border-radius: var(--radius-pill);
  background: var(--state-pending);
}

.module-dot.pending {
  background: var(--caution);
}

.module-dot.changed {
  background: var(--state-staged);
}

.module-dot.accepted {
  background: var(--success);
}

.module-dot.excluded {
  background: var(--state-excluded);
}

.module-name {
  overflow: hidden;
  font-family: var(--font-code);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.module-state {
  flex: 0 0 auto;
  color: var(--text-muted);
  font-size: var(--type-micro-size);
}

.module-item.is-active .module-state {
  color: var(--accent-text);
}

/* The same two numbers, in the same colours, as the diff report. */
.module-counts {
  display: flex;
  flex: 0 0 auto;
  gap: var(--space-2);
  font-family: var(--font-code);
  font-size: var(--type-micro-size);
  font-weight: var(--weight-semibold);
}

.module-count--add {
  color: var(--success-text);
}

.module-count--del {
  color: var(--danger-text);
}

.module-pane-footer {
  padding: var(--space-3);
  border-top: 1px solid var(--border-subtle);
}

.module-legend {
  display: grid;
  margin-bottom: var(--space-2);
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  gap: var(--space-1);
}

.module-legend-item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.module-legend-item::before {
  width: var(--space-2);
  height: var(--space-2);
  border-radius: var(--radius-pill);
  content: "";
}

.module-legend-item:first-child::before {
  background: var(--state-staged);
}

.module-legend-item:last-child::before {
  background: var(--success);
}

.module-pane-footer .button {
  width: 100%;
}

.step-three-workspace {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
}

.step-three-workspace--diff {
  display: grid;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface-code);
  grid-template-rows: var(--diff-toolbar-h) minmax(0, 1fr);
}

.source-table-scroller {
  min-width: 0;
  min-height: 0;
  flex: 1 1 auto;
  overflow: auto;
}

.source-table {
  width: max-content;
  min-width: 100%;
  border-collapse: collapse;
  color: var(--syn-plain);
  font-family: var(--font-code);
  font-size: var(--type-code-size);

  display: table-cell;

.diff-table-scroller.is-wrapped .diff-code {

  min-width: 0;
}

  function createSourceView(documentObject, text) {
    var pane = createElement(
      documentObject,
      "section",
      "code-pane source-pane");
    var header = createElement(
      documentObject,
      "header",
      "code-pane-header");
    var tableScroller = createElement(
      documentObject,
      "div",
      "source-table-scroller");
    var table = createElement(documentObject, "table", "source-table");
    var caption = createElement(
      documentObject,
      "caption",
      "visually-hidden",
      "現在のコード");
    var body = documentObject.createElement("tbody");
    var lines = global.MacroStudioDiff.toLines(text);

    header.appendChild(
      createElement(documentObject, "span", "", "現在のコード"));

    lines.forEach(function (line, index) {
      var row = documentObject.createElement("tr");
      var lineNumber = createElement(
        documentObject,
        "td",
        "source-line-number",
        String(index + 1));
      var code = createElement(documentObject, "td", "source-code");

      lineNumber.setAttribute("aria-hidden", "true");
      global.MacroStudioVbaHighlight.appendHighlighted(code, line);
      row.appendChild(lineNumber);
      row.appendChild(code);
      body.appendChild(row);
    });

    table.appendChild(caption);
    table.appendChild(body);
    tableScroller.appendChild(table);
    pane.appendChild(header);
    pane.appendChild(tableScroller);
    return pane;
  }

  global.MacroStudioDiffView = {
    contextLines: CONTEXT_LINES,
    assignChangeBlocks: assignChangeBlocks,
    getVisibleRows: getVisibleRows,
    expandRow: expandRow,
    expandRows: expandRows,
    getInlineDifference: getInlineDifference,
    hasWhitespaceOnlyChange: hasWhitespaceOnlyChange,
    renderDiff: renderDiff,
    jumpToChange: jumpToChange,

(function () {
  "use strict";

  var GROUPS = [
    { type: "standard", title: "標準モジュール" },
    { type: "class", title: "クラスモジュール" },
    { type: "form", title: "フォームモジュール" },
    { type: "document", title: "ドキュメントモジュール" }
  ];
  var THEME_KEY = "macrostudio.theme";
  var LABELS = {
    caption: "元のコードと改修後のコードのインライン比較",
    codeNote: "− 元のコード / ＋ 改修後のコード"
  };
  var THEME_ICONS =
    '<svg class="theme-icon theme-icon--moon" viewBox="0 0 20 20" aria-hidden="true">' +
    '<path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6 6 0 1 0 8 8Z"></path></svg>' +
    '<svg class="theme-icon theme-icon--sun" viewBox="0 0 20 20" aria-hidden="true" hidden>' +
    '<circle cx="10" cy="10" r="3.25"></circle>' +
    '<path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.35 4.35l1.4 1.4M14.25 14.25l1.4 1.4M15.65 4.35l-1.4 1.4M5.75 14.25l-1.4 1.4"></path></svg>';
  var data = JSON.parse(
    document.getElementById("report-data").textContent);
  var modules = data.modules;
  var selected = 0;
  var listHost;
  var diffHost;

  function element(tag, className, text) {
    var node = document.createElement(tag);
    if (className) {
      node.className = className;
    }
    if (text !== undefined) {
      node.textContent = text;
    }
    return node;
  }

  // One compare per module, by the shared engine, kept for the
  // list counts and every redraw of the same module.
  function rowsOf(module) {
    if (!module.rows) {
      module.rows = MacroStudioDiff.compare(
        module.before,
        module.after);
      module.counts = { added: 0, removed: 0 };
      module.rows.forEach(function (row) {
        if (row.type === "added" || row.type === "changed") {
          module.counts.added += 1;
        }
        if (row.type === "removed" || row.type === "changed") {
          module.counts.removed += 1;
        }
      });
      module.changedLines = MacroStudioDiff.countChangedLines(
        module.rows);
      module.blocks = MacroStudioDiffView.assignChangeBlocks(
        module.rows);
      // Same starting point as the screen: a long module opens on
      // its changes, a short one opens in full.
      if (module.changesOnly === undefined) {
        module.changesOnly = Math.max(
          MacroStudioDiff.toLines(module.before).length,
          MacroStudioDiff.toLines(module.after).length) > 200;
        module.wrap = true;
      }
    }
    return module.rows;
  }

  function counterText(module) {
    return module.blocks > 0
      ? "1/" + module.blocks
      : "0/0";
  }

  function buildList() {
    var pane = element("aside", "panel module-pane");

    pane.appendChild(element(
      "div",
      "module-pane-title",
      "モジュール（" + modules.length + "）"));
    GROUPS.forEach(function (group) {
      var list;

      if (!modules.some(function (module) {
        return module.type === group.type;
      })) {
        return;
      }
      pane.appendChild(element(
        "div",
        "module-group-title",
        group.title));
      list = element("ul", "module-list");
      modules.forEach(function (module, index) {
        var row;

        if (module.type !== group.type) {
          return;
        }
        row = element("li", "module-row");
        row.appendChild(buildItem(module, index));
        list.appendChild(row);
      });
      pane.appendChild(list);
    });
    listHost.textContent = "";
    listHost.appendChild(pane);
  }

  function buildItem(module, index) {
    var item = element("button", "module-item");
    var counts = element("span", "module-counts");

    item.type = "button";
    item.setAttribute("data-module-index", String(index));
    item.classList.toggle("is-active", index === selected);
    item.setAttribute(
      "aria-pressed",
      index === selected ? "true" : "false");
    rowsOf(module);
    item.appendChild(element(
      "span",
      "module-dot " + (module.changed ? "changed" : ""),
      ""));
    item.appendChild(element("span", "module-name", module.name));
    counts.appendChild(element(
      "span",
      "module-count--add",
      "+" + module.counts.added));
    counts.appendChild(element(
      "span",
      "module-count--del",
      "\u2212" + module.counts.removed));
    item.appendChild(counts);
    item.addEventListener("click", function () {
      selected = index;
      buildList();
      renderModule();
    });
    return item;
  }

  function toggleButton(label, pressed, title, onClick) {
    var button = element(
      "button",
      "button button--compact diff-toggle");

    button.type = "button";
    button.setAttribute("aria-pressed", pressed ? "true" : "false");
    if (title) {
      button.title = title;
    }
    button.appendChild(element("span", "button-label", label));
    button.addEventListener("click", onClick);
    return button;
  }

  function actionButton(label, onClick, disabled) {
    var button = element("button", "button button--compact");

    button.type = "button";
    button.disabled = disabled === true;
    button.appendChild(element("span", "button-label", label));
    button.addEventListener("click", onClick);
    return button;
  }

  function renderModule() {
    var module = modules[selected];
    var rows = rowsOf(module);
    var workspace = element(
      "div",
      "step-three-workspace step-three-workspace--diff");
    var toolbar = element("div", "diff-toolbar");
    var resultGroup = element("div", "diff-result-group");
    var actions = element("div", "diff-actions");
    var tableHost = element("div", "diff-table-host");
    var result = element(
      "span",
      "diff-result diff-result--" +
        (module.changed ? "changed" : "unchanged"),
      module.changed
        ? "変更 " + module.changedLines + " 行"
        : "変更なし");
    var counter = element(
      "span",
      "diff-change-counter",
      counterText(module));
    var placeholder;

    result.setAttribute("role", "status");
    result.title = "追加・削除・変更された行の合計です";
    resultGroup.appendChild(result);
    resultGroup.appendChild(element(
      "span",
      "diff-result-note",
      module.typeLabel));
    if (!module.changed) {
      resultGroup.appendChild(element(
        "span",
        "diff-result-note",
        "このモジュールは変更していません"));
    } else if (MacroStudioDiffView.hasWhitespaceOnlyChange(rows)) {
      resultGroup.appendChild(element(
        "span",
        "diff-result-note",
        "空白のみの変更を含む"));
    }

    actions.appendChild(actionButton(
      "\u2191 前の変更",
      function () {
        MacroStudioDiffView.jumpToChange(tableHost, -1, counter);
      },
      module.blocks === 0));
    actions.appendChild(actionButton(
      "\u2193 次の変更",
      function () {
        MacroStudioDiffView.jumpToChange(tableHost, 1, counter);
      },
      module.blocks === 0));
    actions.appendChild(counter);
    actions.appendChild(toggleButton(
      "変更箇所のみ",
      module.changesOnly === true,
      "変更のない行を畳んで、変更箇所だけを表示します",
      function () {
        module.changesOnly = module.changesOnly !== true;
        renderModule();
      }));
    actions.appendChild(toggleButton(
      "折り返し",
      module.wrap !== false,
      "長い行を折り返して全文を表示します",
      function () {
        module.wrap = module.wrap === false;
        renderModule();
      }));
    actions.appendChild(themeButton());

    toolbar.appendChild(resultGroup);
    toolbar.appendChild(actions);
    workspace.appendChild(toolbar);
    workspace.appendChild(tableHost);
    MacroStudioDiffView.renderDiff(
      tableHost,
      rows,
      module.changesOnly === true,
      module.wrap !== false,
      LABELS);
    if (module.isNew) {
      placeholder = element("div", "diff-new-placeholder");
      placeholder.appendChild(element(
        "span",
        "diff-new-placeholder-icon",
        "\uFF0B"));
      placeholder.appendChild(element(
        "p",
        "",
        "新規モジュール — 元のコードはありません。" +

    diffHost.appendChild(workspace);
  }

  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") ===
      "dark" ? "dark" : "light";
  }

  function syncThemeButton(button, theme) {
    var label = "テーマを切り替える（現在: " +
      (theme === "dark" ? "ダーク" : "ライト") + "）";

    if (!button) {
      return;
    }
    button.querySelector(".theme-icon--moon").hidden =
      theme === "dark";
    button.querySelector(".theme-icon--sun").hidden =
      theme !== "dark";
    button.setAttribute("aria-label", label);
    button.title = label;
  }

  function themeButton() {
    var button = element(
      "button",
      "button button--compact button--icon report-theme");

    button.type = "button";
    button.id = "report-theme-toggle";
    button.innerHTML = THEME_ICONS;
    button.addEventListener("click", function () {
      applyTheme(currentTheme() === "dark" ? "light" : "dark");
    });
    syncThemeButton(button, currentTheme());
    return button;
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    syncThemeButton(
      document.getElementById("report-theme-toggle"),
      theme);
    try {
      localStorage.setItem(THEME_KEY, theme);
    } catch (error) {
      /* The choice still applies to this page. */

  }

  // The report opens on the first module that changed, the way the
  // review screen opens on what came in.

  function start() {
    listHost = document.getElementById("report-modules");
    diffHost = document.getElementById("report-diff");
    modules.forEach(function (module) {
      rowsOf(module);
    });

    // The switch is part of the toolbar, so it is built with every
    // redraw and binds its own click there.
    applyTheme(currentTheme());
    buildList();
    renderModule();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
}());
</script>
