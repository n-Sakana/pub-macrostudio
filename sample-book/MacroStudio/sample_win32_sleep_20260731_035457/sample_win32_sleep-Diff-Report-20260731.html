.button {

  }
}

/* ---- screen 0 / 1: the workbook ---- */

.drop-zone {
  display: grid;
  min-height: var(--editor-min-h);
  flex: 1 1 auto;
  place-items: center;
  padding: var(--space-7);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface-sunken);
  text-align: center;
}

.drop-zone:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--surface-selected);
}

.drop-zone h2 {
  margin: 0 0 var(--space-2);
  font-size: var(--type-title-size);
  font-weight: var(--weight-bold);
}

.drop-zone p,
.paste-target p {
  margin: 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

.drop-icon {
  display: grid;
  width: var(--success-icon-size);
  height: var(--success-icon-size);
  margin: 0 auto var(--space-3);
  place-items: center;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  color: var(--accent-text);
}

.drop-icon svg {
  width: var(--icon-lg);
  height: var(--icon-lg);
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.6;
}

.loaded-zone {
  display: flex;
  min-height: var(--editor-min-h);
  align-items: center;
  padding: var(--space-6);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  gap: var(--space-4);
}

.loaded-zone .drop-icon {
  margin: 0;
}

.loaded-zone-details {
  min-width: 0;
  flex: 1 1 auto;
}

.loaded-zone h2 {
  margin: 0;
  font-size: var(--type-title-size);
}

.loaded-zone-path {
  margin: var(--space-1) 0 0;
  overflow: hidden;
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.inline-error-card {
  margin-bottom: var(--space-3);
  padding: var(--space-4);
  border: 1px solid var(--danger);
  border-radius: var(--radius-md);
  background: var(--danger-soft);
}

.inline-error-code {
  color: var(--danger-text);
  font-family: var(--font-code);
  font-size: var(--type-micro-size);
}

.inline-error-card h2 {
  margin: var(--space-1) 0;
  font-size: var(--type-section-size);
}

.inline-error-card p {
  margin: 0;
  color: var(--text-sub);
  font-size: var(--type-meta-size);
}

.book-panel {
  overflow: hidden;
}

.book-main {
  display: grid;
  align-items: stretch;
  padding: var(--space-4);
  gap: var(--space-3);
  grid-template-columns:
    minmax(0, 1fr)
    repeat(3, var(--stat-card-w));
}

.file-card,
.stat-card {
  min-width: 0;
  padding: var(--space-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--surface-sunken);
}

.file-name {
  display: flex;
  align-items: center;
  color: var(--text);
  font-weight: var(--weight-bold);
  gap: var(--space-2);
}

.file-kind {
  display: grid;
  width: var(--file-kind-size);
  height: var(--file-kind-size);
  flex: 0 0 auto;
  place-items: center;
  border-radius: var(--radius-sm);
  background: var(--success-soft);
  color: var(--success-text);
  font-size: var(--type-micro-size);
}

.file-path {
  margin-top: var(--space-2);
  overflow: hidden;
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.stat-label {
  color: var(--text-muted);
  font-size: var(--type-micro-size);
}

.stat-value {
  margin-top: var(--space-1);
  color: var(--text);
  font-size: var(--type-num-size);
  font-weight: var(--weight-bold);
}

.module-strip {
  display: grid;
  padding: 0 var(--space-4) var(--space-4);
  gap: var(--space-2);
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.module-chip {
  min-width: 0;
  padding: var(--space-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--surface-sunken);
  color: var(--text-sub);
  font-family: var(--font-code);
  font-size: var(--type-meta-size);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---- screen 2 / 3: how the request is written ---- */

.choice-list {
  display: grid;
  gap: var(--space-3);
}

.choice-card {
  display: grid;
  width: 100%;
  min-height: var(--card-min-h);
  align-items: center;
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  gap: var(--space-3);
  grid-template-columns: var(--icon-xl) minmax(0, 1fr) var(--icon-lg);
  text-align: left;
}

.choice-card {
  transition:
    background var(--transition-fast),
    border-color var(--transition-fast),
    box-shadow var(--transition-normal),
    transform var(--transition-normal);
}

.choice-card:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--surface-hover);
  box-shadow: var(--shadow-1);
  transform: translateY(-1px);
}

.choice-card:active:not(:disabled) {
  box-shadow: none;
  transform: translateY(0);
  transition-duration: 60ms;
}

.choice-card.is-selected {
  border-color: var(--accent);
  background: var(--surface-selected);
  box-shadow: inset var(--rail-w) 0 0 var(--accent);
}

/* The check does not pop in: it grows into place. */
.choice-card.is-selected .choice-state .flow-icon {
  animation: choice-check var(--transition-normal) both;
}

@keyframes choice-check {
  from {
    opacity: 0;
    transform: scale(.7);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

.choice-card .choice-icon {
  transition:
    background var(--transition-fast),
    border-color var(--transition-fast),
    color var(--transition-fast);
}

.choice-card:hover:not(:disabled) .choice-icon,
.choice-card.is-selected .choice-icon {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.choice-icon {
  display: grid;
  width: var(--icon-xl);
  height: var(--icon-xl);
  place-items: center;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-sunken);
  color: var(--accent-text);
}

.choice-title {
  display: block;
  margin-bottom: var(--space-1);
  color: var(--text);
  font-weight: var(--weight-bold);
}

.choice-description {
  display: block;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
  line-height: var(--type-label-line);
}

.choice-state,
.preset-check {
  display: grid;
  place-items: center;
  color: var(--accent-text);
}

.is-selected .choice-state,
.is-selected .preset-check {
  animation: check-in var(--transition-fast) both;
}

@keyframes check-in {
  from {
    opacity: 0;
    transform: scale(.7);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

.preset-list {
  min-height: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  overflow: auto;
}

.preset {
  display: grid;
  width: 100%;
  min-height: var(--preset-min-h);
  align-items: center;
  padding: var(--space-3);
  border: 0;
  border-bottom: 1px solid var(--border-subtle);
  background: transparent;
  gap: var(--space-3);
  grid-template-columns: minmax(0, 1fr) var(--icon-xl);
  text-align: left;
}

.preset:last-child {
  border-bottom: 0;
}

.preset:hover:not(:disabled) {
  background: var(--surface-selected);
}

.preset.is-selected {
  background: var(--surface-selected);
}

.preset-name {
  display: block;
  margin-bottom: var(--space-half);
  color: var(--text);
  font-weight: var(--weight-semibold);
}

.preset-note {
  display: block;
  overflow: hidden;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.preset-empty {
  margin: 0;
  padding: var(--space-5);
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

.preset-invalid {
  margin-top: var(--space-3);
  padding: var(--space-3);
  border: 1px dashed var(--danger);
  border-radius: var(--radius-sm);
  background: var(--surface-sunken);
}

.preset-invalid-label {
  margin: 0;
  color: var(--danger-text);
  font-size: var(--type-meta-size);
}

.preset-invalid-list {
  margin: var(--space-2) 0 0;
  padding-left: var(--space-5);
  color: var(--text-sub);
  font-size: var(--type-meta-size);
}

.preset-invalid-file {
  margin-right: var(--space-2);
  color: var(--text);
  font-family: var(--font-code);
}

/* ---- screen 4: the request editor ---- */

.editor-panel {
  display: grid;
  flex: 1 1 auto;
  overflow: hidden;
  grid-template-rows: var(--row-h) minmax(0, 1fr);
}

.editor-meta {
  margin-left: auto;
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  font-weight: var(--weight-regular);
}

.request-editor {
  width: 100%;
  height: 100%;
  min-height: var(--editor-min-h);
  padding: var(--space-4);
  border: 0;
  background: var(--surface);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: var(--type-body-size);
  line-height: var(--type-body-line);
  outline: 0;
  resize: none;
}

.editor-note {
  margin: var(--space-3) 0 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

.output-rules-details {
  margin-top: var(--space-3);
  overflow: hidden;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.output-rules-summary {
  display: flex;
  min-height: var(--btn-h-sm);
  align-items: center;
  padding: 0 var(--space-3);
  color: var(--text-sub);
  cursor: pointer;
  font-size: var(--type-meta-size);
  gap: var(--space-2);
  list-style: none;
}

.output-rules-summary::-webkit-details-marker {
  display: none;
}

.output-rules-summary::after {
  margin-left: auto;
  color: var(--text-muted);
  content: "⌄";
}

.output-rules-body {
  max-height: var(--textarea-max-h);
  padding: var(--space-3);
  border-top: 1px solid var(--border-subtle);
  margin: 0;
  overflow: auto;
  color: var(--text-sub);
  font-family: var(--font-code);
  font-size: var(--type-code-size);
  line-height: var(--type-code-line);
  white-space: pre-wrap;
}

.output-rules-note {
  margin: 0;
  padding: var(--space-2) var(--space-3) var(--space-3);
  color: var(--text-muted);
  font-size: var(--type-micro-size);
}

/* ---- screen 5: hand over to the chat ---- */

.handoff {
  display: grid;
  gap: var(--space-3);
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.handoff-card {
  min-width: 0;
  padding: var(--space-4);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.handoff-card.is-done {
  border-color: var(--success);
}

.handoff-number {
  display: grid;
  width: var(--handoff-number-size);
  height: var(--handoff-number-size);
  place-items: center;
  border-radius: var(--radius-pill);
  background: var(--surface-sunken);
  color: var(--text-sub);
  font-size: var(--type-meta-size);
  font-weight: var(--weight-bold);
}

.handoff-card.is-done .handoff-number {
  background: var(--success-soft);
  color: var(--success-text);
}

.handoff-card h2 {
  margin: var(--space-3) 0 var(--space-2);
  font-size: var(--type-section-size);
  font-weight: var(--weight-bold);
}

.handoff-card p {
  margin: 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
  line-height: var(--type-label-line);
}

.file-pill {
  margin-top: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--surface-sunken);
  color: var(--text-sub);
  font-family: var(--font-code);
  font-size: var(--type-meta-size);
}

.inline-actions {
  display: flex;
  margin-top: var(--space-3);
}

.inline-actions .button {
  min-width: var(--control-min-w);
}

.folder-contract {
  margin-top: var(--space-3);
  padding: var(--space-3) var(--space-4) var(--space-4);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.folder-contract-title {
  display: flex;
  align-items: center;
  color: var(--text-sub);
  font-size: var(--type-meta-size);
  font-weight: var(--weight-semibold);
  gap: var(--space-2);
}

.folder-path {
  margin-top: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  background: var(--surface-sunken);
  color: var(--text);
  font-family: var(--font-code);
  font-size: var(--type-meta-size);
  overflow-wrap: anywhere;
}

.artifact-chips {
  display: flex;
  flex-wrap: wrap;
  margin-top: var(--space-3);
  gap: var(--space-2);
}

.artifact-chip {
  padding: var(--space-1) var(--space-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-pill);
  background: var(--surface-sunken);
  color: var(--text-muted);
  font-family: var(--font-code);
  font-size: var(--type-micro-size);
}

/* ---- screens 6 / 7: intake and review ---- */

.code-layout {
  display: grid;
  min-width: 0;
  min-height: 0;
  gap: var(--space-3);
  grid-template-columns: var(--module-pane-w) minmax(0, 1fr);
}

.paste-panel {
  display: grid;
  min-width: 0;
  min-height: 0;
  grid-template-rows: var(--row-h) minmax(0, 1fr);
  overflow: hidden;
}

.intake-body {
  display: flex;
  min-height: 0;
  flex-direction: column;
  padding: var(--space-4);
  gap: var(--space-4);
  overflow: auto;
}

.intake-guide {
  display: grid;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface-sunken);
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.intake-step {
  display: flex;
  align-items: center;
  padding: var(--space-3);
  border-right: 1px solid var(--border-subtle);
  color: var(--text-sub);
  font-size: var(--type-meta-size);
  gap: var(--space-2);
}

.intake-step:last-child {
  border-right: 0;
}

.intake-step-number {
  display: grid;
  width: var(--intake-step-number-size);
  height: var(--intake-step-number-size);
  flex: 0 0 auto;
  place-items: center;
  border-radius: var(--radius-pill);
  background: var(--accent-soft);
  color: var(--accent-text);
  font-size: var(--type-micro-size);
  font-weight: var(--weight-bold);
}

.intake-step-text strong {
  color: var(--text);
}

/* What has arrived so far when the answer comes one module at a time. */

.intake-parts {
  padding: var(--space-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface-sunken);
}

.intake-part-count {
  color: var(--text);
  font-size: var(--type-label-size);
  font-weight: var(--weight-semibold);
}

.intake-part-list {
  display: grid;
  margin-top: var(--space-2);
  gap: var(--space-1);
}

.intake-part-row {
  display: flex;
  align-items: center;
  color: var(--text-sub);
  font-size: var(--type-meta-size);
  gap: var(--space-2);
}

.intake-part-number {
  color: var(--text-muted);
  font-family: var(--font-code);
}

.intake-part-missing {
  margin: var(--space-2) 0 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

.paste-target {
  display: flex;
  flex: 1 1 auto;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: var(--space-6);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface-sunken);
  gap: var(--space-3);
  text-align: center;
}

.paste-target h2 {
  margin: 0;
  font-size: var(--type-section-size);
  font-weight: var(--weight-bold);
}

.paste-target-state {
  display: inline-flex;
  height: var(--badge-h);
  align-items: center;
  padding: 0 var(--space-2);
  border: 1px dashed var(--state-excluded);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  font-weight: var(--type-micro-weight);
}

.diff-review-column {
  display: grid;
  min-width: 0;
  min-height: 0;
  gap: var(--space-3);
  grid-template-rows: minmax(0, 1fr) auto;
}

.review-decision {
  display: flex;
  align-items: center;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  gap: var(--space-2);
}

.review-decision-note {
  flex: 1 1 auto;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

.new-module-intake {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  padding: var(--space-4);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface-sunken);
  gap: var(--space-3);
}

.new-module-field label {
  display: block;
  margin-bottom: var(--space-1);
  color: var(--text-sub);
  font-size: var(--type-meta-size);
  font-weight: var(--weight-semibold);
}

.new-module-input,
.text-input {
  width: 100%;
  height: var(--btn-h);
  padding: 0 var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  font-family: var(--font-code);
  font-size: var(--type-body-size);
}

.new-module-input:focus,
.text-input:focus {
  border-color: var(--focus-color);
  outline: none;
}

.new-module-input[aria-invalid="true"],
.text-input[aria-invalid="true"] {
  border-color: var(--danger);
}

.new-module-hint {
  margin: var(--space-2) 0 0;
  color: var(--text-muted);
  font-size: var(--type-micro-size);
}

.new-module-actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-2);
}

.region-kicker {
  margin: 0;
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  font-weight: var(--weight-semibold);
}

/* ---- screens 8 / 9: what will be built ---- */

.summary-grid {
  display: grid;
  margin-bottom: var(--space-3);
  gap: var(--space-3);
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.summary-card {
  padding: var(--space-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.table-wrap {
  max-height: var(--build-table-max-h);
  overflow: auto;
}

.flow-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--type-meta-size);
}

.flow-table th,
.flow-table td {
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--border-subtle);
  text-align: left;
}

.flow-table thead th {
  position: sticky;
  top: 0;
  background: var(--surface-sunken);
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  font-weight: var(--weight-semibold);
}

.flow-table-name code {
  font-family: var(--font-code);
}

.flow-table-lines {
  font-family: var(--font-code);
  font-variant-numeric: tabular-nums;
}

.flow-table-empty {
  color: var(--text-muted);
}

.new-badge,
.status-badge {
  display: inline-flex;
  align-items: center;
  padding: var(--space-half) var(--space-2);
  border-radius: var(--radius-pill);
  font-size: var(--type-micro-size);
  gap: var(--space-1);
}

.new-badge {
  margin-left: var(--space-2);
  background: var(--accent-soft);
  color: var(--accent-text);
}

.status-badge {
  background: var(--success-soft);
  color: var(--success-text);
}

.output-panel {
  padding: var(--space-4);
}

.field-label {
  display: block;
  margin-bottom: var(--space-2);
  color: var(--text-sub);
  font-size: var(--type-label-size);
  font-weight: var(--weight-semibold);
}

.field-help {
  margin: var(--space-2) 0 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

/* An optional choice on the request screen. It sits beside the main
   path, never in it: leaving it alone is the normal way through. */

.option-row {
  padding: var(--space-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface-sunken);
}

.option-label {
  display: flex;
  align-items: center;
  cursor: pointer;
  gap: var(--space-2);
}

.option-checkbox {
  width: var(--intake-step-number-size);
  height: var(--intake-step-number-size);
  flex: 0 0 auto;
  accent-color: var(--accent);
  cursor: pointer;
}

.option-text {
  color: var(--text);
  font-size: var(--type-label-size);
  font-weight: var(--weight-semibold);
}

.option-help {
  margin: var(--space-2) 0 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

/* ---- screen 10 / 11: build and result ---- */

.build-progress {
  display: flex;
  align-items: center;
  flex-direction: column;
  padding: var(--space-8) var(--space-6);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  gap: var(--space-3);
  text-align: center;
}

.spinner {
  width: var(--progress-spinner-size);
  height: var(--progress-spinner-size);
  border: var(--spinner-border-w) solid var(--border);
  border-radius: var(--radius-pill);
  border-top-color: var(--accent);
  animation: spin 1s linear infinite;
}

.build-progress h2 {
  margin: 0;
  font-size: var(--type-title-size);
}

.build-progress p {
  margin: 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

.build-bar {
  width: 100%;
  height: var(--build-bar-h);
  overflow: hidden;
  border-radius: var(--radius-pill);
  background: var(--surface-sunken);
}

.build-bar span {
  display: block;
  width: 40%;
  height: 100%;
  background: var(--accent);
  animation: build-move 1.4s ease-in-out infinite;
}

@keyframes build-move {
  from {
    transform: translateX(-100%);
  }

  to {
    transform: translateX(250%);
  }
}

.success-panel,
.failure-panel {
  padding: var(--space-6);
  text-align: center;
}

.failure-panel {
  text-align: left;
}

.success-icon {
  display: grid;
  width: var(--success-icon-size);
  height: var(--success-icon-size);
  margin: 0 auto var(--space-3);
  place-items: center;
  border-radius: var(--radius-pill);
  background: var(--success-soft);
  color: var(--success-text);
}

.success-icon svg {
  width: var(--icon-lg);
  height: var(--icon-lg);
}

.success-panel h2 {
  margin: 0 0 var(--space-2);
  font-size: var(--type-title-size);
}

.success-panel p {
  margin: 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

.completion-actions {
  display: flex;
  justify-content: center;
  margin-top: var(--space-4);
}

.result-list {
  margin-top: var(--space-4);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  text-align: left;
}

.result-row {
  display: flex;
  align-items: center;
  padding: var(--space-2) var(--space-3);
  border-top: 1px solid var(--border-subtle);
  color: var(--text-sub);
  font-size: var(--type-meta-size);
  gap: var(--space-2);
}

.result-row:first-child {
  border-top: 0;
}

.result-row .flow-icon {
  color: var(--success-text);
}

.result-row code {
  margin-left: auto;
  color: var(--text-muted);
  font-family: var(--font-code);
}

.result-note {
  margin: var(--space-3) 0 0;
  color: var(--danger-text);
  font-size: var(--type-meta-size);
}

.failure-message {
  margin: 0 0 var(--space-3);
  color: var(--danger-text);
  font-size: var(--type-label-size);
}

.build-result-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--type-meta-size);
}

.build-result-table th,
.build-result-table td {
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--border-subtle);
  text-align: left;
}

.build-status-icon {
  display: inline-grid;
  width: var(--icon-md);
  height: var(--icon-md);
  place-items: center;
}

.build-status-icon svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.6;
}

.build-status-icon--success {
  color: var(--success-text);
}

.build-status-icon--error {
  color: var(--danger-text);
}

.build-status-icon--muted {
  color: var(--text-muted);
}

@media (max-width: 61.25em) {
  .handoff,
  .summary-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .module-strip {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .book-main {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* ---- progressive disclosure ---- */

.disclosure {
  margin-top: var(--space-3);
  overflow: hidden;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.disclosure-trigger {
  display: flex;
  width: 100%;
  min-height: var(--btn-h);
  align-items: center;
  padding: 0 var(--space-3);
  border: 0;
  background: transparent;
  color: var(--text-sub);
  font-size: var(--type-label-size);
  font-weight: var(--weight-semibold);
  gap: var(--space-2);
  text-align: left;
}

.disclosure-trigger:hover {
  background: var(--surface-hover);
  color: var(--text);
}

.disclosure-chevron {
  color: var(--text-muted);
  transition: transform var(--transition-normal);
}

.disclosure[data-open="true"] .disclosure-chevron {
  transform: rotate(90deg);
}

.disclosure-note {
  margin-left: auto;
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  font-weight: var(--weight-regular);
}

/* The body grows in place instead of the page jumping. */
.disclosure-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--transition-slow);
}

.disclosure[data-open="true"] .disclosure-body {
  grid-template-rows: 1fr;
}

/* Closed content stays out of the tab order and the reading order. */
.disclosure-inner {
  min-height: 0;
  overflow: hidden;
  transition: visibility var(--transition-slow);
  visibility: hidden;
}

.disclosure[data-open="true"] .disclosure-inner {
  border-top: 1px solid var(--border-subtle);
  visibility: visible;
}

.disclosure--fill {
  display: flex;
  min-height: 0;
  flex-direction: column;
}

.disclosure--fill .disclosure-body {
  min-height: 0;
  transition: none;
}

.disclosure[data-open="true"].disclosure--fill {
  flex: 1 1 auto;
}

.disclosure[data-open="true"].disclosure--fill .disclosure-body {
  min-height: 0;
  flex: 1 1 auto;
  grid-template-rows: minmax(0, 1fr);
}

.disclosure--fill .disclosure-inner {
  min-height: 0;
  padding: var(--space-3);
}

.disclosure--fill .code-layout {
  height: 100%;
  min-height: 0;
}

/* ---- headline summaries ---- */

.headline-card {
  display: grid;
  align-items: center;
  padding: var(--space-4) var(--space-5);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  gap: 0 var(--space-3);
  grid-template-columns: var(--icon-xl) minmax(0, 1fr);
}

.headline-icon {
  display: grid;
  width: var(--icon-xl);
  height: var(--icon-xl);
  place-items: center;
  border-radius: var(--radius-pill);
  background: var(--success-soft);
  color: var(--success-text);
}

.headline-text {
  color: var(--text);
  font-size: var(--type-section-size);
  font-weight: var(--weight-bold);
}

.headline-preview,
.headline-note,
.headline-warning {
  margin: var(--space-1) 0 0;
  grid-column: 2;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
  line-height: var(--type-label-line);
}

/* Only a finding the user has to act on is coloured as a caution. A
   read that completed keeps the ordinary muted note colour. */
.headline-warning {
  color: var(--caution-text);
}

.read-detail {
  padding: var(--space-1) 0;
}

.read-note {
  margin: var(--space-2) 0 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
  line-height: var(--type-label-line);
}

.request-editor-wrap {
  display: flex;
  min-height: 0;
  flex-direction: column;
}

.request-editor-wrap .request-editor {
  min-height: var(--editor-min-h);
  border-bottom: 1px solid var(--border-subtle);
}

.request-editor-wrap .editor-note {
  margin: 0;
  padding: var(--space-3);
}

.review-empty {
  display: grid;
  height: 100%;
  place-items: center;
  margin: 0;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-md);
  color: var(--text-muted);
  font-size: var(--type-meta-size);
}

/* ---- what the answer says it did ---- */

.intake-result {
  display: flex;
  flex-direction: column;
}

.intake-summary {
  padding: var(--space-3);
}

.intake-summary-line {
  margin: 0;
  color: var(--text-sub);
  font-size: var(--type-body-size);
  line-height: var(--type-body-line);
}

.intake-summary-line:empty {
  height: var(--space-2);
}

/* ---- the consult form ---- */

/* One question at a time. The beads say how many questions there are,
   which one this is, and which are answered: numbered stops on one
   straight line. A long form keeps its ends and folds the middle. */
.bead-rail {
  display: flex;
  justify-content: center;
  padding: var(--space-2) 0 var(--space-6);
}

.bead-track {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
}

/* One straight thread, from the first stop to the last. */
.bead-track::before {
  position: absolute;
  z-index: 0;
  top: 50%;
  right: calc(var(--bead-size) / 2);
  left: calc(var(--bead-size) / 2);
  height: var(--bead-line-h);
  margin-top: calc(var(--bead-line-h) / -2);
  background: var(--border);
  content: "";
}

.bead {
  position: relative;
  z-index: 1;
  display: grid;
  width: var(--bead-size);
  height: var(--bead-size);
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-pill);
  background: var(--surface);
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  font-weight: var(--weight-semibold);
  transition:
    background var(--transition-fast),
    border-color var(--transition-fast),
    color var(--transition-fast),
    transform var(--transition-normal);
}

.bead:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent-text);
  transform: translateY(-1px);
}

.bead.is-answered {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent-text);
}

.bead.is-current {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: var(--shadow-1);
  color: var(--text-on-accent);
  transform: scale(1.18);
}

/* The folded middle is simply a longer run of thread. The numbers on
   either side already say what was skipped, so nothing is drawn. */
.bead-gap {
  width: calc(var(--bead-size) * 1.4);
  height: var(--bead-size);
  flex: 0 0 auto;
}

.question-card {
  display: grid;
  align-items: center;
  gap: var(--space-4);
  grid-template-columns: var(--btn-h) minmax(0, 1fr) var(--btn-h);
}

.question-arrow {
  display: grid;
  width: var(--btn-h);
  height: var(--btn-h);
  place-items: center;
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  background: var(--surface);
  color: var(--text-sub);
  transition:
    background var(--transition-fast),
    border-color var(--transition-fast),
    color var(--transition-fast),
    transform var(--transition-fast);
}

.question-arrow:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--surface-hover);
  color: var(--text);
  transform: scale(1.06);
}

.question-arrow:active:not(:disabled) {
  transform: scale(.96);
  transition-duration: 60ms;
}

.question-arrow:disabled {
  border-color: var(--border-subtle);
  color: var(--text-disabled);
  cursor: not-allowed;
}

.question-body {
  display: flex;
  min-width: 0;
  flex-direction: column;
  padding: var(--space-5);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  gap: var(--space-4);
}

.question-count {
  margin: 0;
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  font-weight: var(--weight-semibold);
  letter-spacing: .06em;
}

.question-text {
  margin: 0;
  color: var(--text);
  font-size: var(--type-section-size);
  font-weight: var(--weight-bold);
  line-height: var(--type-label-line);
}

.question-note {
  margin: var(--space-4) 0 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
  text-align: center;
}

.form-choices {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.form-chip {
  display: inline-flex;
  min-height: var(--btn-h);
  align-items: center;
  padding: 0 var(--space-4);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  background: var(--surface);
  color: var(--text-sub);
  font-size: var(--type-label-size);
  transition:
    background var(--transition-fast),
    border-color var(--transition-fast),
    color var(--transition-fast),
    transform var(--transition-fast);
}

.form-chip:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--surface-hover);
  color: var(--text);
  transform: translateY(-1px);
}

.form-chip:active:not(:disabled) {
  transform: translateY(1px);
  transition-duration: 60ms;
}

.form-chip.is-selected {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent-text);
  font-weight: var(--weight-semibold);
}

.form-textarea {
  width: 100%;
  padding: var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-sunken);
  color: var(--text);
  font-family: inherit;
  font-size: var(--type-body-size);
  line-height: var(--type-body-line);
  resize: none;
}

.form-textarea:focus {
  border-color: var(--accent);
  outline: none;
}

/* The code is not the whole picture: this points at the data too. */
.handoff-note {
  margin: var(--space-4) 0 0;
  color: var(--text-muted);
  font-size: var(--type-meta-size);
  line-height: var(--type-label-line);
  text-align: center;
}

/* The module pane is the tree used by the intake and review screens. */
.module-pane {
  display: grid;
  min-width: 0;
  min-height: 0;
  grid-template-rows: auto minmax(0, 1fr) auto;
  overflow: hidden;
}

.module-pane-title {
  padding: var(--space-3);
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text-sub);
  font-size: var(--type-label-size);
  font-weight: var(--weight-semibold);
}

/* The tree is grouped by module kind, like the VBE project tree. */
.module-group-title {
  padding: var(--space-2) var(--space-3) 0;
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  font-weight: var(--weight-semibold);
  letter-spacing: .03em;
}

.module-list {
  min-height: 0;
  padding: var(--space-2);
  margin: 0;
  list-style: none;
  overflow: auto;
}

.module-item {
  display: grid;
  width: 100%;
  min-height: var(--row-h);
  align-items: center;
  padding: 0 var(--space-2);
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-sub);
  font-size: var(--type-meta-size);
  gap: var(--space-2);
  grid-template-columns: var(--space-2) minmax(0, 1fr) auto;
  text-align: left;
}

.module-item:hover:not(:disabled) {
  background: var(--surface-hover);
}

.module-item.is-active {
  background: var(--surface-selected);
  color: var(--accent-text);
  font-weight: var(--weight-semibold);
}

.module-dot {
  width: var(--space-2);
  height: var(--space-2);
  border-radius: var(--radius-pill);
  background: var(--state-pending);
}

.module-dot.pending {
  background: var(--caution);
}

.module-dot.changed {
  background: var(--state-staged);
}

.module-dot.accepted {
  background: var(--success);
}

.module-dot.excluded {
  background: var(--state-excluded);
}

.module-name {
  overflow: hidden;
  font-family: var(--font-code);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.module-state {
  flex: 0 0 auto;
  color: var(--text-muted);
  font-size: var(--type-micro-size);
}

.module-item.is-active .module-state {
  color: var(--accent-text);
}

/* The same two numbers, in the same colours, as the diff report. */
.module-counts {
  display: flex;
  flex: 0 0 auto;
  gap: var(--space-2);
  font-family: var(--font-code);
  font-size: var(--type-micro-size);
  font-weight: var(--weight-semibold);
}

.module-count--add {
  color: var(--success-text);
}

.module-count--del {
  color: var(--danger-text);
}

.module-pane-footer {
  padding: var(--space-3);
  border-top: 1px solid var(--border-subtle);
}

.module-legend {
  display: grid;
  margin-bottom: var(--space-2);
  color: var(--text-muted);
  font-size: var(--type-micro-size);
  gap: var(--space-1);
}

.module-legend-item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.module-legend-item::before {
  width: var(--space-2);
  height: var(--space-2);
  border-radius: var(--radius-pill);
  content: "";
}

.module-legend-item:first-child::before {
  background: var(--state-staged);
}

.module-legend-item:last-child::before {
  background: var(--success);
}

.module-pane-footer .button {
  width: 100%;
}

.step-three-workspace {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
}

.step-three-workspace--diff {
  display: grid;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface-code);
  grid-template-rows: var(--diff-toolbar-h) minmax(0, 1fr);
}

.source-table-scroller {
  min-width: 0;
  min-height: 0;
  flex: 1 1 auto;
  overflow: auto;
}

.source-table {
  width: max-content;
  min-width: 100%;
  border-collapse: collapse;
  color: var(--syn-plain);
  font-family: var(--font-code);
  font-size: var(--type-code-size);
  line-height: var(--type-code-line);
}

.source-line-number {
  width: var(--line-number-w);
  min-width: var(--line-number-w);
  padding: 0 var(--space-2);
  border-right: 1px solid var(--border-subtle);
  background: var(--surface-sunken);
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  text-align: right;
  user-select: none;
}

.source-code {
  min-width: var(--diff-code-min-w);
  padding: 0 var(--space-3);
  white-space: pre;
}

.step-three-workspace--edit {
  display: grid;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface-code);
  grid-template-rows: var(--diff-toolbar-h) minmax(0, 1fr);
}

.code-pane {
  display: flex;
  min-width: 0;
  min-height: 0;
  flex-direction: column;
  overflow: hidden;
  background: var(--surface-code);
}

.code-pane-header {
  display: flex;
  min-height: var(--pane-header-h);
  flex: 0 0 auto;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--space-3);
  border-bottom: 1px solid var(--border-subtle);
  background: var(--surface);
  color: var(--text-sub);
  font-size: var(--type-meta-size);
  font-weight: var(--type-section-weight);
}

.code-pane-note {
  color: var(--text-muted);
  font-family: var(--font-code);
  font-weight: var(--weight-regular);
}

.source-table-scroller {
  min-width: 0;
  min-height: 0;
  flex: 1 1 auto;
  overflow: auto;
}

.source-table {
  width: max-content;
  min-width: 100%;
  border-collapse: collapse;
  color: var(--syn-plain);
  font-family: var(--font-code);
  font-size: var(--type-code-size);
  line-height: var(--type-code-line);
}

.source-line-number {
  width: var(--line-number-w);
  min-width: var(--line-number-w);
  padding: 0 var(--space-2);
  border-right: 1px solid var(--border-subtle);
  background: var(--surface-sunken);
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  text-align: right;
  user-select: none;
}

.source-code {
  min-width: var(--diff-code-min-w);
  padding: 0 var(--space-3);

}

.edit-workspace-panes {
  display: grid;
  min-width: 0;
  min-height: 0;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  background: var(--border-subtle);
}

/* The manual fix uses the whole width: a half-width code column is
   unreadable, and the original code is one press away in the diff. */
.edit-workspace-panes--single {
  grid-template-columns: minmax(0, 1fr);
}

.edit-pane {
  min-width: 0;
  min-height: 0;
}

.edit-mode-label {
  display: inline-flex;
  height: var(--badge-h);
  align-items: center;
  padding: 0 var(--space-2);
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  color: var(--accent-text);
  font-size: var(--type-micro-size);
  font-weight: var(--type-micro-weight);
}

.edit-textarea {
  min-width: 0;
  min-height: 0;
  flex: 1 1 auto;
  padding: var(--space-2) var(--space-3);
  border: none;
  margin: 0;
  background: var(--surface-code);
  color: var(--syn-plain);
  font-family: var(--font-code);
  font-size: var(--type-code-size);
  line-height: var(--type-code-line);
  white-space: pre;
  overflow: auto;
  resize: none;
  tab-size: 4;
}

.edit-textarea:focus {
  outline: none;
  box-shadow: inset 0 0 0 1px var(--accent);
}

.diff-toolbar {
  display: flex;
  min-width: 0;
  min-height: var(--diff-toolbar-h);
  align-items: center;
  padding: 0 var(--space-3);
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  gap: var(--space-3);
  overflow-x: auto;
}

.diff-result-group,
.diff-actions {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: var(--space-2);
}

/* Neither half gives up its width. The toolbar scrolls sideways when it
   runs out of room, which is what its overflow-x is for. Letting this
   group be squeezed instead does not shorten its text - the labels are
   nowrap - it just pushes them out of their own box and under the
   buttons, which is what an unchanged module used to look like. */
.diff-result-group {
  flex: 0 0 auto;
}

.diff-actions {
  flex: 1 0 auto;
}

.diff-result {
  display: inline-flex;
  min-height: var(--btn-h-sm);
  align-items: center;
  padding: 0 var(--space-3);
  border-radius: var(--radius-md);
  font-size: var(--type-meta-size);
  font-weight: var(--weight-semibold);
  white-space: nowrap;
}

.diff-result--changed {
  background: var(--accent-soft);
  color: var(--accent-text);
}

.diff-result--unchanged {
  background: var(--success-soft);
  color: var(--success-text);
}

.diff-result-note {
  color: var(--text-muted);
  font-size: var(--type-meta-size);
  white-space: nowrap;
}

.diff-change-counter {
  min-width: var(--theme-button-size);
  color: var(--text-muted);
  font-family: var(--font-code);
  font-size: var(--type-meta-size);
  font-variant-numeric: tabular-nums;
  text-align: center;
}

.diff-toggle::after {
  display: inline-grid;
  width: var(--diff-toggle-box);
  height: var(--diff-toggle-box);
  margin-left: var(--space-2);
  place-items: center;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  content: "";
  font-size: var(--type-micro-size);
  line-height: 1;
}

.diff-toggle[aria-pressed="true"]::after {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--text-on-accent);
  content: "✓";
}

.diff-actions [data-action="repaste-response"] {
  margin-left: auto;
}

.diff-column-heading {
  min-width: 0;
  color: var(--text-sub);
  font-size: var(--type-meta-size);
  font-weight: var(--type-section-weight);
}

.diff-column-heading--line,
.diff-column-heading--marker {
  padding: 0 var(--space-2);
  text-align: center;
}

.diff-column-heading--code {
  border-left: 1px solid var(--border);
}

.diff-table-host {
  display: flex;
  min-width: 0;
  min-height: 0;
  flex-direction: column;
  overflow: hidden;
}

.diff-table-scroller {
  width: 100%;
  min-height: 0;
  flex: 1 1 auto;
  overflow: auto;
}

.diff-table {
  width: max-content;
  min-width: 100%;
  border-collapse: collapse;
  color: var(--syn-plain);
  font-family: var(--font-code);
  font-size: var(--type-code-size);
  line-height: var(--type-code-line);
  table-layout: auto;
}

.diff-column--line {
  width: var(--line-number-w);
}

.diff-column--marker {
  width: var(--diff-marker-w);
}

.diff-column--code {
  min-width: var(--diff-code-min-w);
}

.diff-row {
  height: var(--diff-line-h);
}

.diff-line-number {
  width: var(--line-number-w);
  min-width: var(--line-number-w);
  padding: 0 var(--space-2);
  background: var(--surface-sunken);
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  text-align: right;
  user-select: none;
}

.diff-line-number--new {
  border-right: 1px solid var(--border-subtle);
}

.diff-marker {
  width: var(--diff-marker-w);
  min-width: var(--diff-marker-w);
  padding: 0;
  background: var(--surface-code);
  color: var(--text-muted);
  text-align: center;
  user-select: none;
}

.diff-code {
  min-width: var(--diff-code-min-w);
  padding: 0 var(--space-3);
  background: var(--surface-code);
  white-space: pre;
}

/* Unified rows: the whole row carries the state, the way a GitHub
   diff reads top to bottom. */
.diff-row--removed .diff-code,
.diff-row--removed .diff-marker {
  background: var(--diff-removed-bg);
}

.diff-row--removed .diff-marker {
  box-shadow: inset var(--rail-w) 0 0 var(--diff-removed-rail);
  color: var(--diff-removed-rail);
}

.diff-row--removed .diff-line-number {
  background: var(--diff-removed-bg);
}

.diff-row--added .diff-code,
.diff-row--added .diff-marker {
  background: var(--diff-added-bg);
}

.diff-row--added .diff-marker {
  box-shadow: inset var(--rail-w) 0 0 var(--diff-added-rail);
  color: var(--diff-added-rail);
}

.diff-row--added .diff-line-number {
  background: var(--diff-added-bg);
}

.diff-inline-mark {
  padding: 0;
  color: inherit;
}

.diff-inline-mark--removed {
  background: var(--diff-removed-mark);
}

.diff-inline-mark--added {
  background: var(--diff-added-mark);
}

.diff-row.is-jump-target .diff-marker {
  box-shadow: inset var(--jump-rail-w) 0 0 var(--guide-color);
}

.diff-gap {
  height: var(--pane-header-h);
}

.diff-gap-cell {
  padding: 0;
  border-top: 1px solid var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
  background: var(--diff-gap-bg);
  text-align: center;
}

.diff-gap-button {

  height: var(--pane-header-h);

  color: var(--accent-text);
  font-size: var(--type-meta-size);

.diff-gap-button:hover {

  text-decoration: underline;
}

.diff-table-scroller.is-wrapped .diff-table {
  width: 100%;
  table-layout: fixed;
}

.diff-table-scroller.is-wrapped .diff-code {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.vba-token--comment {
  color: var(--syn-comment);
}

.vba-token--string {
  color: var(--syn-string);
}

.vba-token--keyword {
  color: var(--syn-keyword);
}

.vba-token--number {
  color: var(--syn-number);

  .diff-result-note,
  .diff-change-counter {

   alignment with the columns, and stay visible while scrolling. */
.diff-table thead th {

  display: table-cell;
  position: sticky;
  top: 0;
  z-index: 1;
  height: var(--pane-header-h);
  padding: 0 var(--space-3);
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-secondary);
  font-family: var(--font-ui);
  font-size: var(--type-note-size);
  font-weight: 600;
  text-align: left;
  vertical-align: middle;
  white-space: nowrap;
}

.diff-table thead .code-pane-note {
  margin-left: var(--space-2);
}

.diff-table td,
.diff-table th {
  vertical-align: top;
}

.diff-table thead th {
  vertical-align: middle;
}

.diff-table-scroller.is-wrapped .diff-code {
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  word-break: break-word;
}

/* Wrapped mode divides the visible width between the two panes instead
   of letting the code columns claim their natural width. */
.diff-table-scroller.is-wrapped .diff-column--code {
  width: auto;
  min-width: 0;
}

r\n        End If\r\n    Next rowNo\r\n    ApplyApplicationFormatting wsList, lastRow, referenceDate\r\n    WaitMilliseconds 100\r\n    WriteApplicationSummary wsSet, wsList, lastRow, referenceDate\r\n    FormatProcessingLog wsLog\r\n    WaitMilliseconds 250\r\n    AppendProcessLog wsLog, PROC, \"INFO\", _\r\n        \"処理完了。処理=\" & CStr(processed) & _\r\n        \" 要確認=\" & CStr(invalid) & _\r\n        \" 更新=\" & CStr(changed) & _\r\n        \" 経過秒=\" & Format$(ElapsedSeconds(startedAt, Now), \"0.00\"), _\r\n        vbNullString, 0\r\nCleanExit:\r\n    On Error Resume Next\r\n    If stateSaved Then\r\n        Application.Calculation = oldCalc\r\n        Application.ScreenUpdating = oldUpdate\r\n        Application.EnableEvents = oldEvents\r\n        Application.DisplayStatusBar = oldDisplayBar\r\n        Application.StatusBar = oldStatusBar\r\n    End If\r\n    On Error GoTo 0\r\n    Exit Sub\r\nHandleError:\r\n    On Error Resume Next\r\n    If Not wsLog Is Nothing Then\r\n        AppendProcessLog wsLog, PROC, \"ERROR\", _\r\n            \"中断。番号=\" & CStr(Err.Number) & \" 内容=\" & Err.Description, _\r\n            GetApplicationId(wsList, rowNo), rowNo\r\n    End If\r\n    On Error GoTo 0\r\n    Resume CleanExit\r\nEnd Sub\r\n"},{"name":"SystemInfo","type":"standard","typeLabel":"標準モジュール","isNew":false,"changed":true,"before":"Option Explicit\r\n\r\nPublic Const APPLICATION_SHEET_NAME As String = \"申請一覧\"\r\nPublic Const LOG_SHEET_NAME As String = \"処理ログ\"\r\nPublic Const SETTINGS_SHEET_NAME As String = \"設定\"\r\nPublic Const APPLICATION_HEADER_ROW As Long = 4\r\nPublic Const APPLICATION_FIRST_DATA_ROW As Long = 5\r\nPublic Const LOG_HEADER_ROW As Long = 3\r\nPublic Const LOG_FIRST_DATA_ROW As Long = 4\r\nPublic Const COL_ID As Long = 1, COL_APPLIED_AT As Long = 2\r\nPublic Const COL_APPLICANT As Long = 3, COL_DEPARTMENT As Long = 4\r\nPublic Const COL_TYPE As Long = 5, COL_AMOUNT As Long = 6\r\nPublic Const COL_DUE_DATE As Long = 7, COL_STATUS As Long = 8\r\nPublic Const COL_APPROVER As Long = 9, COL_RESULT As Long = 10\r\nPublic Const COL_PROCESSED_AT As Long = 11, COL_NOTE As Long = 12\r\n\r\nPublic Function GetRequiredWorksheet(ByVal sheetName As String) As Worksheet\r\n    Sleep 20\r\n    On Error Resume Next\r\n    Set GetRequiredWorksheet = ThisWorkbook.Worksheets(sheetName)\r\n    On Error GoTo 0\r\n    If GetRequiredWorksheet Is Nothing Then\r\n        Err.Raise vbObjectError + 2401, \"GetRequiredWorksheet\", _\r\n            \"必須シートが見つかりません: \" & sheetName\r\n    End If\r\nEnd Function\r\n\r\nPublic Sub ValidateWorkbookStructure(ByVal wsList As Worksheet, _\r\n    ByVal wsLog As Worksheet, ByVal wsSet As Worksheet)\r\n    Dim listHeaders As Variant, logHeaders As Variant, index As Long\r\n    listHeaders = Array(\"申請ID\", \"申請日\", \"申請者\", \"部門\", \"申請種別\", _\r\n        \"金額\", \"期限\", \"ステータス\", \"承認者\", \"検証結果\", _\r\n        \"最終処理日時\", \"備考\")\r\n    logHeaders = Array(\"日時\", \"処理名\", \"レベル\", \"メッセージ\", \"申請ID\", \"対象行\")\r\n    For index = LBound(listHeaders) To UBound(listHeaders)\r\n        AssertHeader wsList, APPLICATION_HEADER_ROW, index + 1, CStr(listHeaders(index))\r\n    Next index\r\n    Sleep 25\r\n    For index = LBound(logHeaders) To UBound(logHeaders)\r\n        AssertHeader wsLog, LOG_HEADER_ROW, index + 1, CStr(logHeaders(index))\r\n    Next index\r\n    Sleep 25\r\n    If Len(CStr(wsSet.Cells(4, 1).Value2)) = 0 Then\r\n        Err.Raise vbObjectError + 2402, \"ValidateWorkbookStructure\", _\r\n            \"設定シートに設定値がありません。\"\r\n    End If\r\nEnd Sub\r\n\r\nPrivate Sub AssertHeader(ByVal target As Worksheet, ByVal rowNo As Long, _\r\n    ByVal colNo As Long, ByVal expected As String)\r\n    If StrComp(Trim$(CStr(target.Cells(rowNo, colNo).Value2)), _\r\n        expected, vbBinaryCompare) \u003c> 0 Then\r\n        Err.Raise vbObjectError + 2403, \"AssertHeader\", _\r\n            target.Name & \" の見出しが不正です。列=\" & CStr(colNo)\r\n    End If\r\nEnd Sub\r\n\r\nPublic Function GetSettingValue(ByVal wsSet As Worksheet, _\r\n    ByVal settingName As String, ByVal defaultValue As Variant) As Variant\r\n    Dim rowNo As Long, lastRow As Long\r\n    Sleep 10\r\n    lastRow = wsSet.Cells(wsSet.Rows.Count, 1).End(xlUp).Row\r\n    For rowNo = 4 To lastRow\r\n        If StrComp(Trim$(CStr(wsSet.Cells(rowNo, 1).Value2)), _\r\n            settingName, vbBinaryCompare) = 0 Then\r\n            If Len(CStr(wsSet.Cells(rowNo, 2).Value2)) > 0 Then\r\n                GetSettingValue = wsSet.Cells(rowNo, 2).value\r\n            Else\r\n                GetSettingValue = defaultValue\r\n            End If\r\n            Exit Function\r\n        End If\r\n    Next rowNo\r\n    GetSettingValue = defaultValue\r\nEnd Function\r\n\r\nPublic Function GetSettingLong(ByVal wsSet As Worksheet, _\r\n    ByVal settingName As String, ByVal defaultValue As Long) As Long\r\n    Dim value As Variant\r\n    value = GetSettingValue(wsSet, settingName, defaultValue)\r\n    If IsNumeric(value) Then GetSettingLong = CLng(value) Else GetSettingLong = defaultValue\r\nEnd Function\r\n\r\nPublic Function GetSettingDate(ByVal wsSet As Worksheet, _\r\n    ByVal settingName As String, ByVal defaultValue As Date) As Date\r\n    Dim value As Variant\r\n    value = GetSettingValue(wsSet, settingName, defaultValue)\r\n    If IsDate(value) Then\r\n        GetSettingDate = DateValue(CDate(value))\r\n    Else\r\n        GetSettingDate = DateValue(defaultValue)\r\n    End If\r\nEnd Function\r\n\r\nPublic Function GetLastApplicationRow(ByVal wsList As Worksheet) As Long\r\n    GetLastApplicationRow = wsList.Cells(wsList.Rows.Count, COL_ID).End(xlUp).Row\r\n    If GetLastApplicationRow \u003c APPLICATION_FIRST_DATA_ROW Then\r\n        Err.Raise vbObjectError + 2404, \"GetLastApplicationRow\", _\r\n            \"申請一覧に処理対象データがありません。\"\r\n    End If\r\nEnd Function\r\n\r\nPublic Function GetApplicationId(ByVal wsList As Worksheet, _\r\n    ByVal rowNo As Long) As String\r\n    On Error Resume Next\r\n    If Not wsList Is Nothing And rowNo >= APPLICATION_FIRST_DATA_ROW Then\r\n        GetApplicationId = Trim$(CStr(wsList.Cells(rowNo, COL_ID).Value2))\r\n    End If\r\n    On Error GoTo 0\r\nEnd Function\r\n\r\nPublic Sub PrepareLogSheet(ByVal wsLog As Worksheet)\r\n    Sleep 25\r\n    With wsLog.Rows(LOG_HEADER_ROW)\r\n        .Font.Bold = True\r\n        .Interior.Color = RGB(31, 78, 121)\r\n        .Font.Color = RGB(255, 255, 255)\r\n    End With\r\nEnd Sub\r\n\r\nPublic Sub AppendProcessLog(ByVal wsLog As Worksheet, ByVal procName As String, _\r\n    ByVal levelName As String, ByVal messageText As String, _\r\n    ByVal applicationId As String, ByVal targetRow As Long)\r\n    Dim nextRow As Long\r\n    If wsLog Is Nothing Then Exit Sub\r\n    Sleep 10\r\n    nextRow = wsLog.Cells(wsLog.Rows.Count, 1).End(xlUp).Row + 1\r\n    If nextRow \u003c LOG_FIRST_DATA_ROW Then nextRow = LOG_FIRST_DATA_ROW\r\n    wsLog.Cells(nextRow, 1).value = Now\r\n    wsLog.Cells(nextRow, 2).value = procName\r\n    wsLog.Cells(nextRow, 3).value = levelName\r\n    wsLog.Cells(nextRow, 4).value = messageText\r\n    wsLog.Cells(nextRow, 5).value = applicationId\r\n    If targetRow > 0 Then wsLog.Cells(nextRow, 6).value = targetRow\r\nEnd Sub\r\n\r\nPublic Function AddValidationIssue(ByVal current As String, _\r\n    ByVal issueText As String) As String\r\n    If Len(current) = 0 Then\r\n        AddValidationIssue = issueText\r\n    Else\r\n        AddValidationIssue = current & \" / \" & issueText\r\n    End If\r\nEnd Function\r\n\r\nPublic Function IsAllowedStatus(ByVal wsSet As Worksheet, _\r\n    ByVal statusText As String) As Boolean\r\n    Dim rowNo As Long, candidate As String\r\n    For rowNo = 4 To 20\r\n        candidate = Trim$(CStr(wsSet.Cells(rowNo, 4).Value2))\r\n        If Len(candidate) = 0 Then Exit For\r\n        If StrComp(candidate, statusText, vbBinaryCompare) = 0 Then\r\n            IsAllowedStatus = True\r\n            Exit Function\r\n        End If\r\n    Next rowNo\r\nEnd Function\r x))\r\n    Next index\r\n    WaitMilliseconds 25\r\n    If Len(CStr(wsSet.Cells(4, 1).Value2)) = 0 Then\r\n        Err.Raise vbObjectError + 2402, \"ValidateWorkbookStructure\", _\r\n            \"設定シートに設定値がありません。\"\r\n    End If\r\nEnd Sub\r\nPrivate Sub AssertHeader(ByVal target As Worksheet, ByVal rowNo As Long, _\r\n    ByVal colNo As Long, ByVal expected As String)\r\n    If StrComp(Trim$(CStr(target.Cells(rowNo, colNo).Value2)), _\r\n        expected, vbBinaryCompare) \u003c> 0 Then\r\n        Err.Raise vbObjectError + 2403, \"AssertHeader\", _\r\n            target.Name & \" の見出しが不正です。列=\" & CStr(colNo)\r\n    End If\r\nEnd Sub\r\nPublic Function GetSettingValue(ByVal wsSet As Worksheet, _\r\n    ByVal settingName As String, ByVal defaultValue As Variant) As Variant\r\n    Dim rowNo As Long, lastRow As Long\r\n    WaitMilliseconds 10\r\n    lastRow = wsSet.Cells(wsSet.Rows.Count, 1).End(xlUp).Row\r\n    For rowNo = 4 To lastRow\r\n        If StrComp(Trim$(CStr(wsSet.Cells(rowNo, 1).Value2)), _\r\n            settingName, vbBinaryCompare) = 0 Then\r\n            If Len(CStr(wsSet.Cells(rowNo, 2).Value2)) > 0 Then\r\n                GetSettingValue = wsSet.Cells(rowNo, 2).value\r\n            Else\r\n                GetSettingValue = defaultValue\r\n            End If\r\n            Exit Function\r\n        End If\r\n    Next rowNo\r\n    GetSettingValue = defaultValue\r\nEnd Function\r\nPublic Function GetSettingLong(ByVal wsSet As Worksheet, _\r\n    ByVal settingName As String, ByVal defaultValue As Long) As Long\r\n    Dim value As Variant\r\n    value = GetSettingValue(wsSet, settingName, defaultValue)\r\n    If IsNumeric(value) Then GetSettingLong = CLng(value) Else GetSettingLong = defaultValue\r\nEnd Function\r\nPublic Function GetSettingDate(ByVal wsSet As Worksheet, _\r\n    ByVal settingName As String, ByVal defaultValue As Date) As Date\r\n    Dim value As Variant\r\n    value = GetSettingValue(wsSet, settingName, defaultValue)\r\n    If IsDate(value) Then\r\n        GetSettingDate = DateValue(CDate(value))\r\n    Else\r\n        GetSettingDate = DateValue(defaultValue)\r\n    End If\r\nEnd Function\r\nPublic Function GetLastApplicationRow(ByVal wsList As Worksheet) As Long\r\n    GetLastApplicationRow = wsList.Cells(wsList.Rows.Count, COL_ID).End(xlUp).Row\r\n    If GetLastApplicationRow \u003c APPLICATION_FIRST_DATA_ROW Then\r\n        Err.Raise vbObjectError + 2404, \"GetLastApplicationRow\", _\r\n            \"申請一覧に処理対象データがありません。\"\r\n    End If\r\nEnd Function\r\nPublic Function GetApplicationId(ByVal wsList As Worksheet, _\r\n    ByVal rowNo As Long) As String\r\n    On Error Resume Next\r\n    If Not wsList Is Nothing And rowNo >= APPLICATION_FIRST_DATA_ROW Then\r\n        GetApplicationId = Trim$(CStr(wsList.Cells(rowNo, COL_ID).Value2))\r\n    End If\r\n    On Error GoTo 0\r\nEnd Function\r\nPublic Sub PrepareLogSheet(ByVal wsLog As Worksheet)\r\n    WaitMilliseconds 25\r\n    With wsLog.Rows(LOG_HEADER_ROW)\r\n        .Font.Bold = True\r\n        .Interior.Color = RGB(31, 78, 121)\r\n        .Font.Color = RGB(255, 255, 255)\r\n    End With\r\nEnd Sub\r\nPublic Sub AppendProcessLog(ByVal wsLog As Worksheet, ByVal procName As String, _\r\n    ByVal levelName As String, ByVal messageText As String, _\r\n    ByVal applicationId As String, ByVal targetRow As Long)\r\n    Dim nextRow As Long\r\n    If wsLog Is Nothing Then Exit Sub\r\n    WaitMilliseconds 10\r\n    nextRow = wsLog.Cells(wsLog.Rows.Count, 1).End(xlUp).Row + 1\r\n    If nextRow \u003c LOG_FIRST_DATA_ROW Then nextRow = LOG_FIRST_DATA_ROW\r\n    wsLog.Cells(nextRow, 1).value = Now\r\n    wsLog.Cells(nextRow, 2).value = procName\r\n    wsLog.Cells(nextRow, 3).value = levelName\r\n    wsLog.Cells(nextRow, 4).value = messageText\r\n    wsLog.Cells(nextRow, 5).value = applicationId\r\n    If targetRow > 0 Then wsLog.Cells(nextRow, 6).value = targetRow\r\nEnd Sub\r\nPublic Function AddValidationIssue(ByVal current As String, _\r\n    ByVal issueTex       documentObject,

      documentObject,
